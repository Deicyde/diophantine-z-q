name: Kernel Lean build and audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: kernel-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Complete kernel build and exact-target audit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - name: Decide whether this PR affects the kernel
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/kernel-pr-scope.py" <<'KERNEL_SCOPE_PY'
          # BEGIN KERNEL SCOPE
          #!/usr/bin/env python3
          """Conservative PR-only kernel skip decision; embedded before checkout in CI.

          No candidate source is executed. Unknown inputs, malformed API responses and
          incomplete/racing diffs all request the full build. See docs/kernel-ci-scope.md.
          """
          import base64
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import urllib.parse
          import urllib.request


          def api(repo, path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)


          def valid_path(path):
              return (isinstance(path, str) and bool(path) and not path.startswith('/')
                      and '\\' not in path and ':' not in path
                      and all(p not in {'', '.', '..'} for p in path.split('/')))


          def contract_paths(repo, sha):
              value = api(repo, '/contents/KERNEL_CONTRACT.json?ref=' + sha)
              if value.get('type') != 'file' or value.get('encoding') != 'base64':
                  raise ValueError('Kernel contract is not an inline regular file')
              contract = json.loads(base64.b64decode(value['content']))
              files = contract['files']
              if contract.get('schema') != 'kernel-contract/v1' or not isinstance(files, dict) or not files:
                  raise ValueError('Missing or unknown kernel contract')
              if not all(valid_path(p) and isinstance(h, str) and re.fullmatch(r'[0-9a-f]{64}', h)
                         for p, h in files.items()):
                  raise ValueError('Malformed kernel contract entries')
              return set(files)


          def affects_kernel(path, locked):
              if not valid_path(path):
                  return True
              name = PurePosixPath(path).name
              # validate() scans ALL tracked Lean sources and lakefiles for bypass options.
              if (path in locked or path.endswith('.lean')
                      or name in {'lakefile.toml', 'lakefile.lean', 'lake-manifest.json', 'lean-toolchain', 'KERNEL_CONTRACT.json'}
                      or path.startswith(('ZInQKernel/', 'ThirdParty/', 'lean/', 'scripts/', '.lake/', 'build/kernel-ci/'))
                      or path in {'.gitattributes', '.gitmodules', '.github/workflows/kernel-lean.yml'}):
                  return True
              # These independent review-gate sources/tests do not feed the kernel job.
              if path in {'.github/workflows/protocol-b.yml', '.github/protocol-b-reviewer.md'}:
                  return False
              if path.startswith('tests/protocol_b/') and path.endswith('.py'):
                  return False
              if path.startswith(('.github/', 'tests/', 'build/')):
                  return True
              # Versioned polynomial data/verifiers are consumed by Research checks, not
              # by Lake or the kernel audit. The locked/Lean/config rules above win first.
              if re.fullmatch(r'research/version[1-9][0-9]*/.+', path):
                  if (PurePosixPath(path).suffix.lower() in {'.json', '.py', '.txt', '.csv', '.tsv'}
                          or name in {'LICENSE', 'NOTICE'}):
                      return False
              # These two release records feed manuscript/Research checks only.
              if path in {'docs/current-manuscript.json', 'docs/audit-history/builder-binding.json'}:
                  return False
              # Only ordinary documentation formats qualify for the remaining skip path.
              # Data, archives, executables and any unrecognized extension run the build.
              return PurePosixPath(path).suffix.lower() not in {'.md', '.tex', '.bib', '.pdf'}



          def research_only_inputs(paths, locked):
              """A complete PR of research notes/data/verifiers; kernel inputs stay protected."""
              if not paths:
                  return False
              allowed = {'.md', '.tex', '.bib', '.pdf', '.json', '.py', '.txt', '.csv', '.tsv'}
              forbidden = {'scripts', 'script', 'tests', 'test', '.github', '.lake', 'lean', 'zinqkernel', 'thirdparty'}
              config = {'lakefile.toml', 'lakefile.lean', 'lake-manifest.json', 'lean-toolchain',
                        'kernel_contract.json', '.gitattributes', '.gitmodules'}
              for path in paths:
                  if not valid_path(path) or not path.startswith('research/') or path in locked:
                      return False
                  item = PurePosixPath(path)
                  if (any(part.lower() in forbidden for part in item.parts[1:-1])
                          or item.name.lower() in config
                          or item.name.lower().startswith(('test_', 'test-', 'kernel_'))
                          or item.name.lower().endswith(('_test.json', '-test.json'))):
                      return False
                  if item.suffix.lower() not in allowed and item.name not in {'LICENSE', 'NOTICE', 'COPYING'}:
                      return False
              return True


          def decide(event_name, event, repo):
              if event_name != 'pull_request':
                  return True, 'Pushes and manual runs always perform the full kernel build.', []
              pr = event['pull_request']
              number, base, head = pr['number'], pr['base']['sha'], pr['head']['sha']
              if type(number) is not int or number < 1 or not all(re.fullmatch(r'[0-9a-f]{40}', s) for s in [base, head]):
                  raise ValueError('Invalid PR identity')
              if not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
                  raise ValueError('Invalid repository')
              current = api(repo, f'/pulls/{number}')
              def same_revision(value):
                  return value['base']['sha'] == base and value['head']['sha'] == head
              if not same_revision(current):
                  raise ValueError('PR base or head changed')
              count = current['changed_files']
              if type(count) is not int or not 1 <= count <= 3000:
                  raise ValueError('Unavailable or oversized changed-file list')
              rows = []
              for page in range(1, (count + 99) // 100 + 1):
                  batch = api(repo, f'/pulls/{number}/files?per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise ValueError('Invalid changed-file page')
                  rows.extend(batch)
              if len(rows) != count or len({r['filename'] for r in rows}) != count:
                  raise ValueError('Incomplete or duplicate changed-file list')
              paths = set()
              for row in rows:
                  if row.get('status') not in {'added', 'removed', 'modified', 'renamed', 'copied', 'changed'}:
                      raise ValueError('Ambiguous change status')
                  paths.add(row['filename'])
                  if row['status'] == 'renamed':
                      paths.add(row['previous_filename'])
              if not all(valid_path(p) for p in paths):
                  raise ValueError('Invalid changed path')
              locked = contract_paths(repo, base) | contract_paths(repo, head)
              if not same_revision(api(repo, f'/pulls/{number}')):
                  raise ValueError('PR changed during classification')
              if research_only_inputs(paths, locked):
                  return False, 'Only research notes, data and standalone verifiers changed; no Lean, workflow, protected script/test or kernel-contract input changed.', sorted(paths)
              affected = sorted(p for p in paths if affects_kernel(p, locked))
              if affected:
                  return True, 'Kernel inputs or unclassified files changed: ' + ', '.join(affected[:10]), sorted(paths)
              return False, 'Only documentation, versioned research data/verifiers, release records or independent Protocol B files changed; no kernel build or audit input changed.', sorted(paths)


          def main():
              try:
                  event_name = os.environ.get('GITHUB_EVENT_NAME', '')
                  event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()) if event_name == 'pull_request' else {}
                  full, reason, paths = decide(event_name, event, os.environ.get('GITHUB_REPOSITORY', ''))
              except Exception as error:
                  full, reason, paths = True, 'Could not safely classify the PR; performing the full build (' + type(error).__name__ + ').', []
              print(json.dumps({'full_build': full, 'reason': reason, 'changed_paths': paths}))
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('full_build=' + str(full).lower() + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(('Full kernel build required. ' if full else 'Kernel build skipped. ') + reason + '\n')


          if __name__ == '__main__':
              main()
          # END KERNEL SCOPE
          KERNEL_SCOPE_PY
          python3 "$RUNNER_TEMP/kernel-pr-scope.py"
      - name: Identify exact main ref for project cache
        id: cache_ref
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        shell: bash
        run: |
          # Actions string equality ignores case; POSIX test does not.
          if test "$GITHUB_REF" = 'refs/heads/main'; then
            echo 'is_main=true'
          else
            echo 'is_main=false'
          fi >> "$GITHUB_OUTPUT"
      - name: Read the protected main reuse driver
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: .kernel-reuse-main
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/kernel-lean.yml
          sparse-checkout-cone-mode: false
      - name: Select and download verified main outputs
        id: reuse_driver
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trusted="$GITHUB_WORKSPACE/.kernel-reuse-main"
          if [[ ! -f "$trusted/scripts/kernel_build_driver.py" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Verified reuse is not installed on main yet; building cold.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/kernel-reuse-driver"
          cp "$trusted/scripts/"kernel_build_*.py "$RUNNER_TEMP/kernel-reuse-driver/"
          cp "$trusted/scripts/check_kernel_contract.py" "$RUNNER_TEMP/kernel-reuse-driver/"
          workflow_sha=$(sha256sum "$trusted/.github/workflows/kernel-lean.yml" | cut -d' ' -f1)
          python -E -s -B "$RUNNER_TEMP/kernel-reuse-driver/kernel_build_driver.py" select --state "$RUNNER_TEMP/kernel-main-reuse" --repository "$GITHUB_REPOSITORY" --approved-workflow "$workflow_sha"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Check out candidate
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install pinned Lean toolchain
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-elan"
          cd "$RUNNER_TEMP/kernel-elan"
          curl --fail --location --retry 3 -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Validate source contract
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        run: |
          python -B scripts/test_kernel_diagnostics.py
          python -B scripts/test_kernel_phases.py
          python -B scripts/test_kernel_pr_scope.py
          python -B scripts/test_kernel_contract.py
          python -B scripts/test_kernel_cache.py
          python -B -m unittest discover -s scripts -p 'test_kernel_build_*.py'
          python -B scripts/check_kernel_contract.py --output build/kernel-ci/contract.json
      - name: Test rejection of invalid proofs
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        run: python -B scripts/test_kernel_audit.py
      - name: Fetch pinned Mathlib cache
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        run: lake exe cache get
      - name: Prepare verified reuse without credentials
        if: steps.reuse_driver.outputs.enabled == 'true' && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(lean --print-prefix)
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u LAKE_CACHE_KEY -u LAKE_CACHE_ARTIFACT_ENDPOINT -u LAKE_CACHE_REVISION_ENDPOINT -u LAKE_CACHE_SERVICE python -E -s -B "$RUNNER_TEMP/kernel-reuse-driver/kernel_build_driver.py" prepare --state "$RUNNER_TEMP/kernel-main-reuse" --workspace "$GITHUB_WORKSPACE" --prefix "$prefix"
      - name: Load base proof-status evidence
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/kernel_base_report.py
      - name: Add 24 GiB swap for the kernel audit
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        # Preserve existing swap. VM teardown releases this additional file.
        shell: bash
        run: |
          set -euo pipefail
          swap_file=''
          allocation='existing'
          record_swap_on_exit() {
            original_status=$?
            trap - EXIT
            set +e
            args=(--record-swap build/kernel-ci/swap-status.json --disk-path "$RUNNER_TEMP" --allocation "$allocation" --requested-bytes 25769803776)
            if [[ -n "$swap_file" ]]; then args+=(--added-path "$swap_file"); fi
            python -B scripts/kernel_diagnostics.py "${args[@]}"
            record_status=$?
            if (( original_status != 0 )); then exit "$original_status"; fi
            exit "$record_status"
          }
          trap record_swap_on_exit EXIT
          free -m
          df -h "$RUNNER_TEMP"
          swapon --show
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1)
          if (( available < 28 * 1024 * 1024 * 1024 )); then
            allocation='skipped-low-disk'
            echo '::warning::Less than 28 GiB free; cannot add 24 GiB swap while leaving 4 GiB disk headroom. Continuing the full kernel audit with existing swap.'
            echo 'Additional audit swap skipped: insufficient disk space. All audit checks still run.' >> "$GITHUB_STEP_SUMMARY"
          else
            swap_file=$(mktemp "$RUNNER_TEMP/kernel-audit-swap.XXXXXX")
            allocation='added'
            sudo fallocate -l 24G "$swap_file"
            sudo chmod 600 "$swap_file"
            sudo mkswap "$swap_file"
            sudo swapon "$swap_file"
          fi
          free -m
          swapon --show
      - name: Preserve verified swap configuration
        if: always() && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-swap-${{ github.run_attempt }}
          path: build/kernel-ci/swap-status.json
          if-no-files-found: warn
      - name: Build all kernel modules
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u LAKE_CACHE_KEY -u LAKE_CACHE_ARTIFACT_ENDPOINT -u LAKE_CACHE_REVISION_ENDPOINT -u LAKE_CACHE_SERVICE python -B scripts/check_kernel.py --phase build
      - name: Bind completed build to the prepared inputs
        if: steps.reuse_driver.outputs.enabled == 'true' && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        shell: bash
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u LAKE_CACHE_KEY -u LAKE_CACHE_ARTIFACT_ENDPOINT -u LAKE_CACHE_REVISION_ENDPOINT -u LAKE_CACHE_SERVICE python -E -s -B "$RUNNER_TEMP/kernel-reuse-driver/kernel_build_driver.py" built --state "$RUNNER_TEMP/kernel-main-reuse" --workspace "$GITHUB_WORKSPACE"
      - name: Preserve completed build and resource samples
        if: always() && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-build-${{ github.run_attempt }}
          path: |
            build/kernel-ci/build-complete.json
            build/kernel-ci/swap-status.json
            build/kernel-ci/*-memory.jsonl
            build/kernel-ci/*-timing.json
            build/kernel-ci/*-resource-usage.txt
          if-no-files-found: warn
      - name: Replay all kernel proofs and exact targets
        if: steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false'
        env:
          # Lower only the audit worker count; every replay and target check remains.
          LEAN_NUM_THREADS: '1'
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u LAKE_CACHE_KEY -u LAKE_CACHE_ARTIFACT_ENDPOINT -u LAKE_CACHE_REVISION_ENDPOINT -u LAKE_CACHE_SERVICE python -B scripts/check_kernel.py --phase audit --base-report build/kernel-ci/base-audit.json
      - name: Bind full audit and prepare a main-only output bundle
        id: verified_bundle
        if: steps.reuse_driver.outputs.enabled == 'true' && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        shell: bash
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u LAKE_CACHE_KEY -u LAKE_CACHE_ARTIFACT_ENDPOINT -u LAKE_CACHE_REVISION_ENDPOINT -u LAKE_CACHE_SERVICE python -E -s -B "$RUNNER_TEMP/kernel-reuse-driver/kernel_build_driver.py" finish --state "$RUNNER_TEMP/kernel-main-reuse" --workspace "$GITHUB_WORKSPACE"
      - name: Preserve reuse decisions and input evidence
        if: always() && (github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false') && steps.reuse_driver.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-reuse-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-main-reuse/*.json
          if-no-files-found: warn
      - name: Upload proof-status evidence
        if: always() && (steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-audit
          path: build/kernel-ci/
          if-no-files-found: error
      - name: Publish verified successful main build outputs
        if: (github.event_name != 'pull_request' || steps.scope.outcome != 'success' || steps.scope.outputs.full_build != 'false') && steps.verified_bundle.outputs.publish == 'true' && steps.cache_ref.outputs.is_main == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-main-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-main-reuse/bundle/
          include-hidden-files: true
          if-no-files-found: error
