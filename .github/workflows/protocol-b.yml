# Prepared but inactive. MODE is off unless the owner enables test/live.
# No checkout, cache restore, dependency install, or candidate executable.
name: Protocol B

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

concurrency:
  group: protocol-b-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  run_reviewers:
    name: Run reviewers and publish App check
    if: >-
      (vars.PROTOCOL_B_MODE == 'live' || vars.PROTOCOL_B_MODE == 'test') &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/protocol-b review' || startsWith(github.event.comment.body, '/protocol-b override '))))
    runs-on: ubuntu-24.04
    environment: protocol-b
    timeout-minutes: 120
    steps:
      - name: Mint check-only App token
        id: app_start
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PROTOCOL_B_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_B_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Review pinned sources using both approved models
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app_start.outputs.token }}
          APP_ID: ${{ vars.PROTOCOL_B_APP_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ vars.PROTOCOL_B_MODE }}
          MANUSCRIPT_PROFILE: ${{ vars.PROTOCOL_B_MANUSCRIPT_PROFILE }}
          TEST_PR: ${{ vars.PROTOCOL_B_TEST_PR }}
          NOTES_ISSUE: ${{ vars.PROTOCOL_B_NOTES_ISSUE }}
        run: |
          cat > "$RUNNER_TEMP/protocol-b.py" <<'PROTOCOL_B_PYTHON'
          """Embedded in the trusted default-branch workflow; never imports candidate code."""
          import base64
          import concurrent.futures
          import datetime
          import functools
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          MODELS = {"astra": "gpt-6-astra", "fable": "claude-fable-5-2"}
          CHECK = "Protocol B / review"
          MARKER = "<!-- protocol-b-review-v1 -->"
          INSTRUCTIONS = ".github/protocol-b-reviewer.md"
          WORKFLOW = ".github/workflows/protocol-b.yml"
          WORKING_MARKER = "<!-- protocol-b-working-v2 -->"
          ROUND_MARKER = "<!-- protocol-b-automatic-round-v1 -->"
          SUMMARY_MARKER = "<!-- protocol-b-round-summary-v1 -->"
          CONTEXT_TOKEN_BUDGET = 400_000
          TOOL_CHARACTER_BUDGET = 1_200_000
          OUTPUT_TOKEN_BUDGET = 64_000
          FORMAT_TOKEN_RESERVE = 8_192
          RECOVERY_TOKEN_RESERVE = 4_096
          REVIEWER_OUTPUT_RESERVE = OUTPUT_TOKEN_BUDGET
          FINISH_NOW_INSTRUCTION = (
              'Review context is low. Finish now with finish_review; do not request more '
              'file reads, searches, or web fetches. In the report, include a Not reviewed '
              'list naming the relevant sources, claims, or checks you did not complete '
              '(write None if all required review is complete). If any required check '
              'remains incomplete, request changes and set scope_complete to false; '
              'unread work is not itself a mathematical finding. Preserve and '
              'disposition every earlier finding; do not claim to have read omitted material.'
          )
          WEB_MAX_USES = {'web_search': 3, 'web_fetch': 5}
          WEB_FETCH_MAX_CONTENT_TOKENS = 20_000
          # Search has no content-token cap, and the fetch cap does not cover binary
          # PDFs. These are accounting reserves, not provider-enforced limits.
          WEB_SEARCH_RESULT_RESERVE = 16_000
          WEB_BINARY_RESULT_RESERVE = 128_000


          def configure_budget(files):
              """Choose one profile from the complete GitHub diff, before reviewers start.

              Published windows: gpt-6-astra 1,050,000; claude-fable-5-2 1,000,000.
              Both profiles include the output and formatting reserves within the cap.
              """
              global CONTEXT_TOKEN_BUDGET, TOOL_CHARACTER_BUDGET, WEB_MAX_USES, WEB_FETCH_MAX_CONTENT_TOKENS
              configured = os.environ.get('MANUSCRIPT_PROFILE', '') or 'standard'
              if configured not in {'standard', 'expanded'}:
                  raise ValueError('MANUSCRIPT_PROFILE must be standard or expanded; no model call')
              manuscript = any(path.startswith('manuscripts/') for file in files
                               for path in (file['filename'], file.get('previous_filename', '')))
              expanded = manuscript and configured == 'expanded'
              CONTEXT_TOKEN_BUDGET = 900_000 if expanded else 400_000
              TOOL_CHARACTER_BUDGET = 1_200_000 * CONTEXT_TOKEN_BUDGET // 400_000
              WEB_MAX_USES = {'web_search': 10, 'web_fetch': 20} if expanded else {'web_search': 3, 'web_fetch': 5}
              WEB_FETCH_MAX_CONTENT_TOKENS = 50_000 if expanded else 20_000
              return {'profile': 'manuscript-expanded' if expanded else 'standard',
                      'configured_manuscript_profile': configured, 'manuscript_changed': manuscript,
                      'tool_character_budget': TOOL_CHARACTER_BUDGET,
                      'context_token_budget': CONTEXT_TOKEN_BUDGET,
                      'output_token_budget': OUTPUT_TOKEN_BUDGET,
                      'reviewer_output_reserve': REVIEWER_OUTPUT_RESERVE,
                      'fable_web_max_uses': dict(WEB_MAX_USES),
                      'fable_web_fetch_max_content_tokens': WEB_FETCH_MAX_CONTENT_TOKENS}


          REQUIRED_COMPUTATIONS = {
              "Accepted Lean helpers and axiom audit", "Construction regeneration and finite checks",
              "Paper build", "Reconstructed quartic and Version 5 inventory",
              "Version 12 source and quartic replay (ubuntu-24.04)",
              "Version 12 source and quartic replay (windows-2022)",
              "Version 13 source and quartic replay (ubuntu-24.04)",
              "Version 13 source and quartic replay (windows-2022)",
              "Version 6 quartic reproduction and inventory",
              "Version 9 odd-product replay (ubuntu-24.04)",
              "Version 9 odd-product replay (windows-2022)",
              "Complete kernel build and exact-target audit",
              "Current 214-variable quartic and numerical certificate", "current-222",
          }
          OUT = pathlib.Path(os.environ.get("RUNNER_TEMP", ".")) / "protocol-b-reports"


          def record(name, value):
              OUT.mkdir(parents=True, exist_ok=True)
              temporary = OUT / (name + "." + str(time.time_ns()) + ".tmp")
              temporary.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              temporary.replace(OUT / name)


          def log(message):
              print(datetime.datetime.now(datetime.timezone.utc).isoformat(), message, flush=True)


          class RequestError(RuntimeError):
              """An HTTP failure with its status preserved for narrow caller handling."""
              def __init__(self, detail):
                  self.status = detail['status']
                  super().__init__(json.dumps(detail))


          def request(url, headers, method="GET", data=None, stream=False, before_retry=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=payload, method=method,
                                           headers={"Content-Type": "application/json", **headers})
              for attempt in range(3):
                # The initial guard runs in Review.run; repeat after every backoff.
                if attempt and before_retry is not None:
                    before_retry()
                try:
                  response = urllib.request.urlopen(req, timeout=180)
                  break
                except urllib.error.HTTPError as error:
                  # Preserve the actual server error; never print headers containing credentials.
                  with error:
                      body = error.read().decode("utf-8", errors="replace")
                  safe_headers = {k: v for k, v in error.headers.items()
                                  if k.lower() in {"x-github-request-id", "request-id", "x-request-id",
                                                   "retry-after", "x-ratelimit-remaining", "x-ratelimit-reset"}}
                  detail = {"url": url, "method": method, "status": error.code,
                            "headers": safe_headers, "body": body}
                  for secret in (os.environ.get(k) for k in ("GH_TOKEN", "APP_TOKEN", "OPENAI_API_KEY", "ANTHROPIC_API_KEY")):
                      if secret:
                          detail = json.loads(json.dumps(detail).replace(secret, "[REDACTED]"))
                  record("http-error-" + str(time.time_ns()) + ".json", detail)
                  try:
                      spend_cap = json.loads(body).get('error', {}).get('details', {}).get('error_code') == 'enforced_spend_limit_reached'
                  except (ValueError, AttributeError):
                      spend_cap = False
                  # Only retry a provider's initial HTTP rejection, before receiving a
                  # stream. Never replay GitHub writes or a partially consumed stream.
                  if (stream and url in {"https://api.openai.com/v1/responses", "https://api.anthropic.com/v1/messages"}
                          and not spend_cap and (error.code == 429 or 500 <= error.code <= 599) and attempt < 2):
                      try:
                          requested = float(error.headers.get('Retry-After', '0'))
                      except ValueError:
                          requested = 0
                      if not math.isfinite(requested) or requested > 300:
                          raise RuntimeError('Provider Retry-After exceeds the five-minute retry budget; not retrying early. ' + json.dumps(detail)) from None
                      delay = max(65 * 2 ** attempt if error.code == 429 else 2 ** (attempt + 1), requested)
                      log(f"Provider HTTP {error.code}; retry {attempt+1}/2 after {delay}s before any stream output")
                      time.sleep(delay)
                      continue
                  raise RequestError(detail) from None
              if stream:
                  return response
              with response:
                  raw = response.read()
                  return json.loads(raw) if raw else None


          class GitHub:
              def __init__(self, repo, token):
                  if not re.fullmatch(r"[\w.-]+/[\w.-]+", repo):
                      raise ValueError("Invalid repository")
                  self.repo = repo
                  self.headers = {"Authorization": "Bearer " + token,
                                  "Accept": "application/vnd.github+json",
                                  "X-GitHub-Api-Version": "2022-11-28"}

              def api(self, path, method="GET", data=None):
                  return request("https://api.github.com" + path, self.headers, method, data)

              def call(self, path, method="GET", data=None):
                  return self.api("/repos/" + self.repo + path, method, data)

              def dispatch_workflow(self, workflow, ref):
                  # This API version returns the exact new run ID, avoiding list-run races.
                  return request('https://api.github.com/repos/' + self.repo +
                                 '/actions/workflows/' + workflow + '/dispatches',
                                 {**self.headers, 'X-GitHub-Api-Version': '2026-03-10'},
                                 'POST', {'ref': ref})

              def pages(self, path):
                  result = []
                  for page in range(1, 501):
                      rows = self.call(path + ("&" if "?" in path else "?") + f"per_page=100&page={page}")
                      if not isinstance(rows, list):
                          raise ValueError("Expected a list from " + path)
                      result.extend(rows)
                      if len(rows) < 100:
                          return result
                  raise ValueError("Pagination limit reached; no partial review is allowed")

              @functools.lru_cache(maxsize=32)
              def text(self, path, ref):
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      raise ValueError("Source ref must be a commit")
                  if path.startswith("/") or any(p in {"", ".", ".."} for p in path.split("/")):
                      raise ValueError("Invalid repository path")
                  try:
                      value = self.call("/contents/" + urllib.parse.quote(path, safe="/") + "?ref=" + ref)
                  except RequestError as error:
                      if error.status != 404:
                          raise
                      # An added/deleted/renamed file can be absent at this pinned revision.
                      # Review.run returns ValueError as a tool result, without counting a read.
                      raise ValueError(f"File {path!r} was not found at commit {ref} (HTTP 404). Check the path and requested revision; the file may exist only at the other revision.") from None
                  if not isinstance(value, dict) or value.get("type") != "file":
                      raise ValueError("Not a regular file")
                  if value["size"] > 16_000_000:
                      raise ValueError("File exceeds 16 MB; use its specification or request a smaller review")
                  if value.get("encoding") != "base64":
                      value = self.call("/git/blobs/" + value["sha"])
                  return base64.b64decode(value["content"], validate=False).decode("utf-8")


          def classify(files, declaration):
              """Editorial paths plus a complete diff guard; ambiguous changes escalate."""
              if not files:
                  raise ValueError("Empty or unavailable diff")
              editorial_paths = {"README.md", "CREDITS.md"}
              math_text = re.compile(r"[0-9$\\=<>^]|\b(theorem|lemma|proof|claim|conjecture|axiom|degree|quartic|polynomial|variable|coefficient|bound|rational|integer|diophantine|decidab\w*|verif\w*|audit\w*|protocol|require\w*|policy)\b", re.I)
              editorial = declaration and all(
                  f["status"] == "modified" and f["filename"].endswith(".md") and
                  not f["filename"].startswith((".github/", "docs/research-review/")) and f["filename"] != "PROJECT.md" and
                  "patch" in f and
                  sum(x.startswith("+") for x in f["patch"].splitlines()) == f["additions"] and
                  sum(x.startswith("-") for x in f["patch"].splitlines()) == f["deletions"] and
                  ([x[1:].rstrip() for x in f["patch"].splitlines() if x.startswith("+")] ==
                   [x[1:].rstrip() for x in f["patch"].splitlines() if x.startswith("-")] or
                   (f["filename"] in editorial_paths and not math_text.search("\n".join(
                       x[1:] for x in f["patch"].splitlines() if x.startswith(("+", "-"))))))
                  for f in files)
              if editorial:
                  return "editorial"
              # Unavailable/binary diffs, additions, policy, dependencies and a new record
              # all get the broader review. No author label can downgrade the rule.
              new = re.compile(r"\b(theorem|corollary|proposition|record|route|dependency|axiom|import|cite)\b|\\(?:cite|begin\{theorem)", re.I)
              for f in files:
                  path = f["filename"]
                  if (f["status"] != "modified" or "patch" not in f or
                      path.startswith(".github/") or path in {"PROJECT.md", "lake-manifest.json", "lean-toolchain"} or
                      path.startswith(("docs/research-review/", "docs/current-manuscript", "docs/release-policy")) or
                      new.search("\n".join(x for x in f["patch"].splitlines() if x.startswith(("+", "-"))))):
                      return "new result or route"
              return "local mathematical"


          def review_profile(files, author_has_write):
              """Limit automatic rounds without reducing either reviewer's required scope."""
              if not author_has_write:
                  return {'name': 'light', 'reason': 'outside contributor', 'automatic_paid_round_limit': 1}
              # Other docs/ paths include proof inventories, review records and policy.
              # Unlisted documentation retains the full profile until explicitly classified.
              ordinary_docs = {'README.md', 'CREDITS.md', 'THIRD_PARTY_NOTICES.md',
                               'docs/building.md', 'docs/research-guide.md'}
              focused = 0 < len(files) <= 5
              total = 0
              for item in files:
                  path = item.get('filename', '')
                  if (item.get('status') not in {'modified', 'added', 'removed'} or
                          item.get('previous_filename') or not path.endswith('.md') or
                          path not in ordinary_docs or '..' in pathlib.PurePosixPath(path).parts or
                          not isinstance(item.get('patch'), str)):
                      focused = False
                      continue
                  adds, deletes = item.get('additions'), item.get('deletions')
                  if (type(adds) is not int or type(deletes) is not int or min(adds, deletes) < 0 or
                          sum(line.startswith('+') for line in item['patch'].splitlines()) != adds or
                          sum(line.startswith('-') for line in item['patch'].splitlines()) != deletes):
                      focused = False
                      continue
                  total += adds + deletes
              if focused and total <= 200:
                  return {'name': 'light', 'reason': 'focused documentation change', 'automatic_paid_round_limit': 1}
              return {'name': 'full', 'reason': 'ordinary review scope', 'automatic_paid_round_limit': 4}


          SOURCE_CHECK_SCHEMA = {"type": "object", "additionalProperties": False,
              "properties": {"source_id": {"type": "string"}, "location": {"type": "string"},
                             "outcome": {"type": "string", "enum": ["verified", "unavailable"]},
                             "detail": {"type": "string"}},
              "required": ["source_id", "location", "outcome", "detail"]}
          ACCESS_LIMIT_SCHEMA = {"type": "object", "additionalProperties": False,
              "properties": {"finding_id": {"type": "string"}, "detail": {"type": "string"},
                             "source_ids": {"type": "array", "items": {"type": "string"}}},
              "required": ["finding_id", "detail", "source_ids"]}
          FINISH_SCHEMA = {
              "type": "object", "additionalProperties": False,
              "properties": {
                  "decision": {"type": "string", "enum": ["accept", "changes_requested"]},
                  "not_reviewed": {"type": "array", "items": {"type": "string"}, "description": "Specific unreviewed sources, arguments or checks; empty only when the required scope is complete."},
                  "scope_complete": {"type": "boolean", "description": "All required review was completed, apart from explicitly recorded source-access limitations. False for unread work, interruptions or budget exhaustion."},
                  "report": {"type": "string", "description": "Full substantive review with source locations, scope and limitations."},
                  "findings": {"type": "array", "items": {"type": "object", "additionalProperties": False,
                      "properties": {"id": {"type": "string"}, "location": {"type": "string"},
                                     "objection": {"type": "string"},
                                     "severity": {"type": "string", "enum": ["blocking", "note"]},
                                     "kind": {"type": "string", "enum": ["error", "gap", "source_access", "editorial"]},
                                     "attempted_resolution": {"type": "string"}},
                      "required": ["id", "location", "objection", "severity", "kind", "attempted_resolution"]}},
                  "prior_findings": {"type": "array", "items": {"type": "object", "additionalProperties": False,
                      "properties": {"id": {"type": "string"}, "resolution": {"type": "string", "enum": ["resolved", "unresolved", "overridden"]},
                                     "reason": {"type": "string"}}, "required": ["id", "resolution", "reason"]}},
                  "sources_read": {"type": "array", "items": {"type": "string"}},
                  "source_checks": {"type": "array", "items": SOURCE_CHECK_SCHEMA},
                  "access_limitations": {"type": "array", "items": ACCESS_LIMIT_SCHEMA},
                  "not_outside_reviewed": {"type": "array", "items": {"type": "string"}},
              }, "required": ["decision", "scope_complete", "not_reviewed", "report", "findings", "prior_findings", "sources_read", "not_outside_reviewed", "source_checks", "access_limitations"],
          }
          TOOLS = [
              {"name": "read_file", "description": "Read a pinned PR or base text file by lines; binary PDFs return a pinned public URL. Never executes content.",
               "parameters": {"type": "object", "properties": {"path": {"type": "string"},
                 "revision": {"type": "string", "enum": ["head", "base"]}, "start": {"type": "integer"}, "count": {"type": "integer"}},
                 "required": ["path", "revision", "start", "count"], "additionalProperties": False}},
              {"name": "list_files", "description": "List pinned head paths with a literal substring; results are paged, never silently truncated.",
               "parameters": {"type": "object", "properties": {"contains": {"type": "string"}, "offset": {"type": "integer"}},
                 "required": ["contains", "offset"], "additionalProperties": False}},
              {"name": "read_history", "description": "After reading primary proof sources, obtain all previous PR review findings and discussion. Required before final decision.",
               "parameters": {"type": "object", "properties": {}, "required": [], "additionalProperties": False}},
              {"name": "finish_review", "description": "Deliver the complete final review, including disposition of every earlier finding. This does not itself approve GitHub.",
               "parameters": FINISH_SCHEMA},
          ]


          def blocking_findings(review):
              # Old stored reports did not carry severity. They remain blocking.
              return [f for f in review['findings'] if f.get('severity', 'blocking') != 'note']


          def validate_review(value, prior_ids, overrides, allow_incomplete=False, retained_findings=None):
              if set(value) != set(FINISH_SCHEMA["required"]):
                  raise ValueError("Incomplete final report")
              if value["decision"] not in {"accept", "changes_requested"} or not isinstance(value["report"], str) or len(value["report"]) < 80:
                  raise ValueError("Invalid decision or missing substantive report")
              for key in ("findings", "prior_findings", "sources_read", "not_outside_reviewed", "source_checks", "access_limitations"):
                  if not isinstance(value[key], list):
                      raise ValueError("Expected report list: " + key)
              if not value["sources_read"] and not (allow_incomplete and value['decision'] == 'changes_requested'):
                  raise ValueError("No sources read")
              if type(value['scope_complete']) is not bool:
                  raise ValueError('Report must state whether its required scope was reviewed')
              if value['decision'] == 'accept' and not value['scope_complete']:
                  raise ValueError('Incomplete review cannot accept')
              if not isinstance(value['not_reviewed'], list) or any(not isinstance(x, str) or not x.strip() for x in value['not_reviewed']):
                  raise ValueError('Unreviewed scope must be an itemized list')
              if not value['scope_complete'] and not value['not_reviewed']:
                  raise ValueError('Incomplete scope must identify what was not reviewed')
              if value['scope_complete'] and value['not_reviewed']:
                  raise ValueError('Unreviewed work cannot be called complete')
              ids = [x["id"] for x in value["findings"]]
              if len(ids) != len(set(ids)) or any(not re.fullmatch(r"[A-Za-z0-9_-]{1,40}", i) for i in ids):
                  raise ValueError("Invalid or duplicate finding IDs")
              for finding in value['findings']:
                  if finding.get('severity') not in {'blocking', 'note'}:
                      raise ValueError('Each fresh finding needs a severity')
                  if finding.get('kind') not in {'error', 'gap', 'source_access', 'editorial'}:
                      raise ValueError('Each fresh finding needs a kind')
                  if (finding['severity'] == 'note') != (finding['kind'] == 'editorial'):
                      raise ValueError('Only editorial observations are nonblocking notes')
                  if not isinstance(finding.get('attempted_resolution'), str):
                      raise ValueError('Each finding needs its attempted-resolution field')
                  if finding['kind'] == 'gap' and len(finding['attempted_resolution'].strip()) < 40:
                      raise ValueError('A gap needs the attempted argument or source check and its remaining obstruction')
              dispositions = value["prior_findings"]
              retained_findings = set(retained_findings or ())
              if not retained_findings <= prior_ids:
                  raise ValueError('A retained finding must be an actual pending obligation')
              required = prior_ids - retained_findings
              if len(dispositions) != len(required) or {x["id"] for x in dispositions} != required:
                  raise ValueError("Earlier findings were omitted or duplicated")
              for item in dispositions:
                  if item["resolution"] not in {"resolved", "unresolved", "overridden"} or not item["reason"].strip():
                      raise ValueError("Missing finding disposition")
                  if item["resolution"] == "overridden" and item["id"] not in overrides:
                      raise ValueError("No authenticated collaborator override")
              if any(x["resolution"] == "overridden" for x in dispositions) and not value["not_outside_reviewed"]:
                  raise ValueError("Override must leave the affected claim not outside reviewed")
              if value["decision"] == "accept" and (blocking_findings(value) or any(x["resolution"] == "unresolved" for x in dispositions)):
                  raise ValueError("Acceptance cannot contain unresolved objections")
              checks = value['source_checks']
              if len({s['source_id'] for s in checks}) != len(checks):
                  raise ValueError('Duplicate source checks')
              for s in checks:
                  if (s['outcome'] not in {'verified', 'unavailable'} or not s['source_id'].strip()
                          or not s['location'].strip() or len(s['detail'].strip()) < 20):
                      raise ValueError('A source check needs a precise passage and substantive detail')
              unavailable = {s['source_id'] for s in checks if s['outcome'] == 'unavailable'}
              unresolved = {f['id'] for f in blocking_findings(value)} | {s['id'] for s in dispositions if s['resolution'] == 'unresolved'}
              limits = value['access_limitations']
              if len({s['finding_id'] for s in limits}) != len(limits):
                  raise ValueError('Duplicate access limitations')
              for s in limits:
                  if (s['finding_id'] not in unresolved or not s['source_ids']
                          or not set(s['source_ids']) <= unavailable or len(s['detail'].strip()) < 20):
                      raise ValueError('Access limitation must name an unresolved access-only finding and unavailable passages')
              if len(json.dumps(value, ensure_ascii=False).encode()) > 45_000:
                  raise ValueError("Report exceeds permanent PR comment limit; shorten prose without omitting findings")
              return value


          def sse(response):
              """Complete SSE events. Never log hidden thinking or credential-bearing requests."""
              data = []
              with response:
                  for line in response:
                      line = line.decode("utf-8").rstrip("\r\n")
                      if not line:
                          if data:
                              text = "\n".join(data)
                              data = []
                              if text != "[DONE]":
                                  yield json.loads(text)
                      elif line.startswith("data:"):
                          data.append(line[5:].lstrip())
              if data and "\n".join(data) != "[DONE]":
                  yield json.loads("\n".join(data))


          def model_body(family, system, conversation):
              if family == "astra":
                  return {"model": MODELS[family], "instructions": system, "input": conversation,
                          "reasoning": {"effort": "high"}, "max_output_tokens": OUTPUT_TOKEN_BUDGET,
                          "store": False, "stream": True, "include": ["reasoning.encrypted_content"],
                          "tools": [{"type": "function", "strict": True, **t} for t in TOOLS] + [{"type": "web_search"}]}
              return {"model": MODELS[family], "system": system, "messages": conversation,
                      "max_tokens": OUTPUT_TOKEN_BUDGET, "stream": True, "output_config": {"effort": "high"},
                      "cache_control": {"type": "ephemeral", "ttl": "1h"},
                      "tools": [{"name": t["name"], "description": t["description"], "input_schema": t["parameters"]} for t in TOOLS] + [
                          {"type": "web_search_20260318", "name": "web_search", "max_uses": WEB_MAX_USES['web_search']},
                          {"type": "web_fetch_20260318", "name": "web_fetch", "max_uses": WEB_MAX_USES['web_fetch'],
                           "max_content_tokens": WEB_FETCH_MAX_CONTENT_TOKENS, "response_inclusion": "excluded"}]}


          def request_size(body):
              return len(json.dumps(body, ensure_ascii=False).encode('utf-8'))


          def context_units(family, body):
              """Account for web results without treating opaque payload bytes as tokens.

              Only provider result blocks in assistant messages get this treatment.
              Repository text and unknown block types still use conservative bytes.
              Never edit the actual messages: signatures and tool results must replay
              unchanged. The next request's initial provider usage recalibrates this
              estimate. This is not an exact tokenizer or a spending guarantee.
              """
              units = request_size(body)
              if family == 'fable':
                  for message in body['messages']:
                      if message.get('role') != 'assistant' or not isinstance(message.get('content'), list):
                          continue
                      for block in message['content']:
                          kind = block.get('type')
                          if kind == 'web_fetch_tool_result':
                              content = block.get('content')
                              if not isinstance(content, dict) or content.get('type') != 'web_fetch_result':
                                  continue  # Errors have no fetched document.
                              source = content.get('content', {}).get('source', {})
                              reserve = (WEB_FETCH_MAX_CONTENT_TOKENS if source.get('type') == 'text'
                                         else WEB_BINARY_RESULT_RESERVE)
                          elif kind == 'web_search_tool_result' and isinstance(block.get('content'), list):
                              reserve = WEB_SEARCH_RESULT_RESERVE
                          else:
                              continue
                          # Keep metadata in the byte estimate; only bound the payload.
                          payload_bytes = request_size(block['content'])
                          units -= max(0, payload_bytes - reserve)
              return units


          def web_allowance(family, conversation):
              """Direct calls carry across tool-result/pause continuations; dynamic
              filtering calls reset per request. Do not advertise a review-wide quota.
              See Claude's web-fetch-tool documentation, 'Max uses'.
              """
              if family != 'fable':
                  return {'scope': 'Provider-managed; no local web-use cap for this reviewer.'}
              used = dict.fromkeys(WEB_MAX_USES, 0)
              for message in conversation:
                  content = message.get('content')
                  if message.get('role') == 'user':
                      if not isinstance(content, list) or any(b.get('type') != 'tool_result' for b in content):
                          used = dict.fromkeys(WEB_MAX_USES, 0)
                  elif message.get('role') == 'assistant' and isinstance(content, list):
                      for block in content:
                          if (block.get('type') == 'server_tool_use' and block.get('name') in used
                                  and (block.get('caller') or {}).get('type', 'direct') == 'direct'):
                              used[block['name']] += 1  # Failed/pending calls count conservatively.
              return {'direct_this_turn': {name: max(0, cap - used[name]) for name, cap in WEB_MAX_USES.items()},
                      'programmatic_next_request_maximum': dict(WEB_MAX_USES),
                      'fetch_text_tokens_per_result': WEB_FETCH_MAX_CONTENT_TOKENS,
                      'scope': 'Direct calls share the current turn limit; programmatic calls reset per request. '
                               'Fetch text may be truncated by the provider; do not claim to have read omitted text.'}


          def web_response_observation(output, usage, response_id, turn):
              """Record transport metadata only, never document bodies or signed thinking."""
              results = []
              for block in output:
                  if block.get('type') not in {'web_fetch_tool_result', 'web_search_tool_result'}:
                      continue
                  content = block.get('content')
                  document = content.get('content', {}) if isinstance(content, dict) else {}
                  source = document.get('source', {}) if isinstance(document, dict) else {}
                  data = source.get('data') if isinstance(source, dict) else None
                  results.append({'type': block['type'], 'tool_use_id': block.get('tool_use_id'),
                                  'source_type': source.get('type') if isinstance(source, dict) else None,
                                  'document_payload_present': isinstance(data, str),
                                  'document_payload_bytes': len(data.encode('utf-8')) if isinstance(data, str) else 0,
                                  'text_may_be_truncated': source.get('type') == 'text' if isinstance(source, dict) else False,
                                  'result_bytes': request_size(block)})
              reported = (usage or {}).get('server_tool_use') or {}
              fetches = reported.get('web_fetch_requests')
              returned = sum(r['type'] == 'web_fetch_tool_result' for r in results)
              return {'turn': turn, 'response_id': response_id,
                      'assistant_content_sha256': hashlib.sha256(json.dumps(output, ensure_ascii=False).encode()).hexdigest(),
                      'reported_web_usage': reported, 'returned_results': results,
                      'unreturned_reported_fetches': max(0, fetches - returned) if type(fetches) is int else None,
                      'omission_note': 'When call/result pairs are omitted, their identities and success are not observable here. Counts alone do not prove omission worked.',
                      'next_request': {'status': 'not sent; guard, final decision, or failure may end the review'}}


          def context_estimate(family, system, conversation, previous=None):
              """Preflight estimate from reported tokens plus conservative byte growth.

              Count-tokens does not support this gate's server tools. Do not pretend a
              characters/4 conversion is an exact count. Include tools and instructions,
              cache reads/writes, output allowance and a formatting reserve. The provider
              can still add server-tool context internally; this is not a billing cap.
              """
              body = model_body(family, system, conversation)
              size, units = request_size(body), context_units(family, body)
              estimated = units
              basis = 'request bytes with bounded web-result accounting'
              if previous:
                  usage = previous.get('usage') or {}
                  fields = ['input_tokens', 'output_tokens']
                  if family == 'fable':
                      fields += ['cache_read_input_tokens', 'cache_creation_input_tokens']
                  if 'input_tokens' in usage and all(type(usage.get(k, 0)) is int and usage.get(k, 0) >= 0 for k in fields):
                      inputs = usage['input_tokens']
                      input_basis = 'reported input tokens'
                      if family == 'fable':
                          inputs += usage.get('cache_read_input_tokens', 0) + usage.get('cache_creation_input_tokens', 0)
                      growth = units - previous.get('context_units', previous['request_bytes'])
                      if size < previous['request_bytes'] or growth < 0:
                          raise ValueError('Review request shrank unexpectedly; no history may be silently discarded')
                      if family == 'fable':
                          # Final usage can accumulate the same cached input across
                          # internal server-tool calls. It is not the context length.
                          # Preserve message_start's input separately before deltas.
                          initial = usage.get('request_start_input_tokens')
                          if type(initial) is int and initial >= 0:
                              inputs = initial
                              input_basis = 'message_start input tokens'
                          elif previous.get('server_tools') or usage.get('server_tool_use'):
                              inputs = previous.get('estimated_input_tokens', previous.get('context_units', previous['request_bytes']))
                              input_basis = 'previous preflight (cumulative server usage excluded)'
                      estimated = inputs + max(growth, usage.get('output_tokens', 0))
                      basis = input_basis + ' plus bounded growth/output tokens'
              total = estimated + FORMAT_TOKEN_RESERVE + OUTPUT_TOKEN_BUDGET
              observation = {'family': family, 'request_bytes': size, 'context_units': units, 'estimated_input_tokens': estimated,
                             'format_reserve': FORMAT_TOKEN_RESERVE, 'output_reserve': OUTPUT_TOKEN_BUDGET,
                             'estimated_total': total, 'budget': CONTEXT_TOKEN_BUDGET, 'basis': basis}
              return observation


          def context_budget(family, system, conversation, previous=None):
              observation = context_estimate(family, system, conversation, previous)
              total = observation['estimated_total']
              record(family + '-context-budget.json', observation)
              if total > CONTEXT_TOKEN_BUDGET:
                  raise RuntimeError(f'{family} context budget exceeded before the next model request: estimated {total:,} including reserves; limit {CONTEXT_TOKEN_BUDGET:,}. Narrow or split the review scope; no history was truncated.')
              return observation


          def model_turn(family, system, conversation, before_retry=None):
              body = model_body(family, system, conversation)
              if family == "astra":
                  response = request("https://api.openai.com/v1/responses",
                                     {"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]}, "POST", body, True, before_retry=before_retry)
                  final = None
                  for event in sse(response):
                      if event.get("type") == "response.completed":
                          final = event["response"]
                      elif event.get("type") in {"error", "response.failed", "response.incomplete"}:
                          raise RuntimeError(json.dumps(event))
                  if final is None or final.get("status") != "completed":
                      raise RuntimeError("OpenAI stream ended without a completed response")
                  return final["output"], final.get("model"), final.get("usage"), final["id"], final["status"]
              response = request("https://api.anthropic.com/v1/messages",
                                 {"x-api-key": os.environ["ANTHROPIC_API_KEY"], "anthropic-version": "2023-06-01"}, "POST", body, True, before_retry=before_retry)
              final, blocks, partial, stopped, initial_inputs = {}, {}, {}, False, None
              for event in sse(response):
                  kind = event.get("type")
                  if kind == "error":
                      raise RuntimeError(json.dumps(event))
                  if kind == "message_start":
                      final = event["message"]
                      initial_usage = final.get('usage') or {}
                      fields = ('input_tokens', 'cache_read_input_tokens', 'cache_creation_input_tokens')
                      if 'input_tokens' in initial_usage and all(type(initial_usage.get(k, 0)) is int and initial_usage.get(k, 0) >= 0 for k in fields):
                          initial_inputs = sum(initial_usage.get(k, 0) for k in fields)
                  elif kind == "content_block_start":
                      blocks[event["index"]] = event["content_block"]
                  elif kind == "content_block_delta":
                      index, delta = event["index"], event["delta"]
                      field = {"text_delta": "text", "thinking_delta": "thinking", "signature_delta": "signature"}.get(delta["type"])
                      if field:
                          blocks[index][field] = blocks[index].get(field, "") + delta[field]
                      elif delta["type"] == "input_json_delta":
                          partial[index] = partial.get(index, "") + delta["partial_json"]
                      elif delta["type"] == "citations_delta":
                          blocks[index].setdefault("citations", []).append(delta["citation"])
                      else:
                          raise RuntimeError("Unrecognized Anthropic delta: " + delta["type"])
                  elif kind == "content_block_stop" and event["index"] in partial:
                      blocks[event["index"]]["input"] = json.loads(partial[event["index"]] or "{}")
                  elif kind == "message_delta":
                      final.update(event["delta"])
                      final.setdefault("usage", {}).update(event.get("usage", {}))
                  elif kind == "message_stop":
                      stopped = True
              if not stopped or final.get("stop_reason") not in {"tool_use", "end_turn", "pause_turn"}:
                  raise RuntimeError("Anthropic response blocked: " + json.dumps({"stream_complete": stopped,
                                     "stop_reason": final.get("stop_reason"), "stop_details": final.get("stop_details")}))
              if initial_inputs is not None:
                  final.setdefault('usage', {})['request_start_input_tokens'] = initial_inputs
              return [blocks[i] for i in sorted(blocks)], final.get("model"), final.get("usage"), final.get("id"), final.get("stop_reason")


          def working_comment_body(working):
              """Keep the latest prose within one comment; complete notes live in artifacts."""
              value = {**working, 'notes': list(working['notes'])}
              def render():
                  notice = 'Partial review, not a verdict.'
                  if value.get('earlier_notes_in_artifact'):
                      notice += '\nEarlier notes are in the run artifact: ' + value['artifact_url']
                  return WORKING_MARKER + '\n' + notice + '\n```json\n' + json.dumps(value, ensure_ascii=False) + '\n```'
              if len(render().encode('utf-8')) <= 45_000:
                  return render()
              value['earlier_notes_in_artifact'] = True
              while len(value['notes']) > 1 and len(render().encode('utf-8')) > 45_000:
                  value['notes'].pop(0)
              if len(render().encode('utf-8')) > 45_000:
                  # One note can itself exceed the limit. Find a suffix that fits, taking
                  # UTF-8 bytes and JSON escaping into account rather than counting chars.
                  note = value['notes'][0]
                  low, high = 0, len(note)
                  while low < high:
                      keep = (low + high + 1) // 2
                      value['notes'] = ['[Earlier text in run artifact]\n' + note[-keep:]]
                      if len(render().encode('utf-8')) <= 45_000:
                          low = keep
                      else:
                          high = keep - 1
                  value['notes'] = ['[Earlier text in run artifact]\n' + (note[-low:] if low else '')]
              return render()


          def delivered_obligations(payloads, identity, known_prior):
              """Failed submissions add objections; only a validated final can close them."""
              findings, dispositions = {}, {}
              for attempt, value in enumerate(payloads):
                  if not isinstance(value, dict) or not isinstance(value.get('findings'), list):
                      continue
                  for index, finding in enumerate(value['findings']):
                      if not isinstance(finding, dict) or (finding.get('severity') == 'note' and finding.get('kind') == 'editorial'):
                          continue
                      ident = str(finding.get('id', ''))
                      if not re.fullmatch(r'[A-Za-z0-9_-]{1,40}', ident):
                          ident = f'unvalidated-{attempt+1}-{index+1}'
                      objection = 'Unvalidated delivered objection: '+str(finding.get('objection', finding))
                      if ident not in findings:
                          findings[ident] = {'id': ident, 'severity': 'blocking', 'kind': 'error',
                              'location': str(finding.get('location', '')), 'objection': objection,
                              'attempted_resolution': str(finding.get('attempted_resolution', ''))}
                      elif objection not in findings[ident]['objection']:
                          findings[ident]['objection'] += '\n'+objection
              known = set(known_prior) | {finding_id(identity, ident) for ident in findings}
              for value in payloads:
                  if not isinstance(value, dict) or not isinstance(value.get('prior_findings'), list):
                      continue
                  for disposition in value['prior_findings']:
                      if not isinstance(disposition, dict):
                          continue
                      ident = disposition.get('id')
                      if isinstance(ident, str) and ident in known and disposition.get('resolution') != 'resolved':
                          reason = 'Unvalidated delivered disposition: '+str(disposition.get('reason', 'No reason supplied.'))
                          if ident not in dispositions:
                              dispositions[ident] = {'id': ident, 'resolution': 'unresolved', 'reason': reason}
                          elif reason not in dispositions[ident]['reason']:
                              dispositions[ident]['reason'] += '\n'+reason
              return {'findings': list(findings.values()), 'prior_findings': list(dispositions.values())}


          class Review:
              def __init__(self, gh, pr, files, history, prior, overrides, instructions, family, change_class):
                  self.gh, self.pr, self.family = gh, pr, family
                  self.history, self.prior, self.overrides = history, dict(prior), overrides
                  self.original_prior_ids = set(prior)
                  self.delivered_finals, self.pending_fresh_ids = [], set()
                  self.instructions = instructions
                  self.history_read, self.reads, self.tree, self.chars = False, [], None, 0
                  self.file_lines, self.working_comment, self.notes = {}, None, []
                  self.finish_now = False
                  self.identity_error = False
                  self.invalid_finish = None
                  self.discovery = {}
                  self.binary_dependencies = set()
                  self.initial_files = files
                  self.initial_packet = None
                  self.original_files_digest = hashlib.sha256(json.dumps(files, sort_keys=True).encode()).hexdigest()
                  self.input = {"repository": gh.repo, "pull_request": pr["number"], "head": pr["head"]["sha"],
                                "base": pr["base"]["sha"], "change_class": change_class,
                                "untrusted_title": pr["title"], "untrusted_description": pr.get("body"), "files": files}

              def pending_payloads(self):
                  values = list(self.delivered_finals)
                  if self.invalid_finish is not None and self.invalid_finish not in values:
                      values.append(self.invalid_finish)
                  return values

              def pending_obligations(self):
                  identity = {'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                              'reviewer': self.family}
                  return delivered_obligations(self.pending_payloads(), identity, self.prior)

              def remember_delivered(self):
                  identity = {'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                              'reviewer': self.family}
                  for finding in self.pending_obligations()['findings']:
                      ident = finding_id(identity, finding['id'])
                      self.prior.setdefault(ident, {**finding, 'origin': 'Unvalidated final delivered by this reviewer in this run'})
                      if ident not in self.original_prior_ids:
                          self.pending_fresh_ids.add(ident)

              def retained_pending_findings(self, value):
                  if not isinstance(value, dict) or not isinstance(value.get('findings'), list):
                      return set()
                  identity = {'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                              'reviewer': self.family}
                  return {finding_id(identity, f['id']) for f in value['findings']
                          if isinstance(f, dict) and isinstance(f.get('id'), str)
                          and f.get('severity') != 'note'} & self.pending_fresh_ids

              def tool(self, name, args):
                  if name == "read_history":
                      self.history_read = True
                      return {"discussion": self.history, "earlier_findings": self.prior, "authenticated_overrides": self.overrides}
                  if name == "read_file":
                      if args["revision"] not in {"head", "base"}:
                          raise ValueError("Invalid revision")
                      ref = self.pr[args["revision"]]["sha"]
                      path = args["path"]
                      start, count = args["start"], args["count"]
                      if not isinstance(start, int) or not isinstance(count, int) or start < 1 or not 1 <= count <= 1000:
                          raise ValueError("Read 1 to 1000 lines, starting at line 1 or later")
                      if path.lower().endswith(".pdf"):
                          self.binary_dependencies.add((path, args["revision"]))
                          return {"pdf_url": "https://raw.githubusercontent.com/" + self.gh.repo + "/" + ref + "/" + urllib.parse.quote(path),
                                  "instruction": "Read via web tools; an unavailable source is not verified."}
                      if (path, ref) not in self.file_lines:
                          self.file_lines[path, ref] = self.gh.text(path, ref).splitlines()
                      lines = self.file_lines[path, ref]
                      result = "\n".join(f"{i+1}: {lines[i]}" for i in range(start-1, min(len(lines), start-1+count)))
                      if len(result) > 100_000:
                          raise ValueError("Requested lines exceed 100,000 characters; request fewer lines")
                      self.reads.append({"path": path, "revision": ref, "start": start, "count": count})
                      return {"total_lines": len(lines), "text": result}
                  if name == "list_files":
                      if self.tree is None:
                          tree = self.gh.call("/git/trees/" + self.pr["head"]["sha"] + "?recursive=1")
                          if tree.get("truncated"):
                              raise ValueError("GitHub truncated the tree; cannot claim complete file discovery")
                          self.tree = [x["path"] for x in tree["tree"] if x["type"] == "blob"]
                      matches = sorted(p for p in self.tree if args["contains"] in p)
                      self.discovery[args['contains']] = hashlib.sha256(json.dumps(matches).encode()).hexdigest()
                      offset = args["offset"]
                      if not isinstance(offset, int) or offset < 0:
                          raise ValueError("Invalid offset")
                      return {"total": len(matches), "paths": matches[offset:offset+200], "next_offset": offset+200 if offset+200 < len(matches) else None}
                  raise ValueError("Unknown tool")

              def prepare_initial_input(self):
                  """Defer oversized inline patches; never omit a changed file or prior turn."""
                  conversation = [{"role": "user", "content": json.dumps(self.input)}]
                  before = context_estimate(self.family, self.instructions, conversation)
                  limit = CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE - REVIEWER_OUTPUT_RESERVE
                  omitted = []
                  if before['estimated_total'] > limit:
                      files = []
                      for original in self.input['files']:
                          item = {k: v for k, v in original.items() if k != 'patch'}
                          if 'patch' in original:
                              omitted.append(original['filename'])
                              item['patch_omitted'] = ('Deferred from the initial packet. Old hunk ranges refer to the PR merge base, '
                                  'not necessarily the base tip served by read_file(base); new ranges refer to head. '
                                  'Read affected sources and verify old-side identity before judging. If base has diverged '
                                  'and the removed text cannot be verified, report the limitation; do not assume ranges match.')
                              item['patch_hunks'] = re.findall(r'^@@ -\d+(?:,\d+)? \+\d+(?:,\d+)? @@', original['patch'], re.M)
                          files.append(item)
                      self.input['files'] = files
                      self.initial_files = files
                      if omitted:
                          self.input['merge_base'] = reuse_refs(self.gh, self.pr, True)['merge_base']
                  conversation = [{"role": "user", "content": json.dumps(self.input)}]
                  after = context_estimate(self.family, self.instructions, conversation)
                  self.initial_packet = {
                      'patches_deferred': bool(omitted), 'deferred_patch_count': len(omitted),
                      'changed_files': len(self.initial_files), 'merge_base': self.input.get('merge_base'),
                      'read_evidence': 'Only displayed patch text and admitted source reads; deferred hunk ranges are not read evidence.'}
                  record(self.family + '-initial-packet.json', {
                      'before': before, 'after': after, 'deferred_patches': omitted,
                      'changed_files': len(self.initial_files),
                      'scope': 'Only unsent inline patches were deferred. File metadata and hunk ranges remain. Deferred source is not read evidence; the existing hard guard still applies.'})

              def run(self):
                  self.prepare_initial_input()
                  conversation = [{"role": "user", "content": json.dumps(self.input)}]
                  record(self.family + "-input.json", {"instructions": self.instructions, "input": self.input})
                  turns, previous, web_trace = [], None, []
                  instructions, finish_sent = self.instructions, False
                  def check_computations():
                      failed = failed_computation_checks(self.gh, self.pr['head']['sha'], self.pr['base']['ref'])
                      if failed:
                          raise RuntimeError('fix failing checks first: ' + ', '.join(failed) + '; no further model call')
                  finish_instruction = FINISH_NOW_INSTRUCTION + '\nPrior finding IDs: ' + json.dumps(sorted(self.prior)) + \
                      '. If you could not review an earlier finding, disposition it as unresolved and explain that limitation.'
                  for turn in range(50):
                      log(f"{self.family}: model turn {turn+1}; {len(self.reads)} repository source reads")
                      projected = context_estimate(self.family, instructions, conversation, previous)
                      if (CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE - projected['estimated_total']
                              < REVIEWER_OUTPUT_RESERVE):
                          self.finish_now = True
                      if self.finish_now:
                          # Keep system/tools and all earlier messages immutable: signed
                          # thinking binds their exact prefix. Fable permits an appended
                          # system message only after a user message (including tool results).
                          # A paused assistant turn must be resumed unchanged first.
                          if not finish_sent and (self.family != 'fable' or conversation[-1].get('role') == 'user'):
                              conversation.append({'role': 'system' if self.family == 'fable' else 'developer',
                                                   'content': finish_instruction})
                              finish_sent = True
                          record(self.family + '-finish-now.json', {'turn': turn + 1, 'reason': 'low context',
                                 'projected': projected, 'reviewer_output_reserve': REVIEWER_OUTPUT_RESERVE})
                      budget = context_budget(self.family, instructions, conversation, previous)
                      check_computations()
                      replay_hash = None
                      if self.family == 'fable' and web_trace:
                          last_assistant = next(m['content'] for m in reversed(conversation) if m.get('role') == 'assistant')
                          replay_hash = hashlib.sha256(json.dumps(last_assistant, ensure_ascii=False).encode()).hexdigest()
                      output, served, usage, response_id, stop_reason = model_turn(
                          self.family, instructions, conversation, before_retry=check_computations)
                      if served != MODELS[self.family]:
                          self.identity_error = True
                          raise RuntimeError(f"Requested {MODELS[self.family]}, API reported {served}; no silent substitution")
                      # Capture every final call before diagnostics, including malformed
                      # concurrent submissions. Failed corrections cannot replace older ones.
                      delivered = [x for x in output if x.get('name') == 'finish_review'
                                   and x.get('type') in {'function_call', 'tool_use'}]
                      decode_errors = []
                      for call in delivered:
                          try:
                              raw_final = json.loads(call['arguments']) if self.family == 'astra' else call['input']
                              self.invalid_finish = json.loads(json.dumps(raw_final))
                              self.delivered_finals.append(self.invalid_finish)
                          except (ValueError, TypeError, KeyError) as error:
                              decode_errors.append(str(error))
                      if delivered:
                          record(self.family+'-delivered-finals.json', self.delivered_finals)
                          record(self.family+'-delivered-final.json', self.invalid_finish)
                      if decode_errors:
                          record(self.family+'-final-decode-error.json', {'errors': decode_errors})
                      if self.family == 'fable':
                          if web_trace:
                              web_trace[-1]['next_request'] = {
                                  'status': 'accepted response received', 'response_id': response_id,
                                  'reported_input_tokens': (usage or {}).get('request_start_input_tokens'),
                                  'assistant_replayed_unchanged': replay_hash == web_trace[-1]['assistant_content_sha256']}
                          web_trace.append(web_response_observation(output, usage, response_id, turn + 1))
                          record('fable-web-results.json', web_trace)
                      previous = {**budget, 'usage': usage,
                                  'server_tools': any(x.get('type') == 'server_tool_use' for x in output)}
                      # The exact provider conversation, including signed/encrypted reasoning,
                      # stays in memory. Retain inputs, source reads, visible report and usage.
                      visible = [{k: v for k, v in x.items() if k not in {"thinking", "signature", "encrypted_content"}}
                                 for x in output if x.get("type") not in {"thinking", "reasoning", "redacted_thinking"}]
                      turns.append({"response_id": response_id, "reported_model": served, "usage": usage, "context_budget": budget, "stop_reason": stop_reason, "visible_output": visible})
                      record(self.family + "-turns.json", turns)
                      # Preserve prose objections before the next model request. These are
                      # discussion, never approval. A failed later turn cannot erase them.
                      prose = []
                      for item in visible:
                          if item.get("type") == "text":
                              prose.append(item.get("text", ""))
                          elif item.get("type") == "message":
                              prose.extend(c.get("text", "") for c in item.get("content", []) if c.get("type") == "output_text")
                      text = "\n".join(prose).strip()
                      if text:
                          self.notes.append(text)
                          # One evolving working comment per reviewer/run, not a new
                          # notification on every turn. Complete output is in artifacts.
                          working = {"reviewer": self.family, "head": self.pr['head']['sha'],
                                     "run": os.environ['GITHUB_RUN_ID'], "attempt": os.environ['GITHUB_RUN_ATTEMPT'],
                                     "notes": self.notes,
                                     "artifact_url": f"https://github.com/{self.gh.repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"}
                          record(self.family + '-working-notes.json', working)
                          body = working_comment_body(working)
                          try:
                              if self.working_comment is None:
                                  self.working_comment = self.gh.call(f"/issues/{self.pr['number']}/comments", "POST", {"body": body})['id']
                              else:
                                  self.gh.call(f"/issues/comments/{self.working_comment}", "PATCH", {"body": body})
                          except Exception as error:
                              record(self.family+'-working-comment-error.json', {'error': str(error), 'turn': turn+1})
                              log(self.family+': working notification failed; original output retained: '+str(error))
                      if self.family == "astra":
                          conversation.extend(output)
                          calls = [x for x in output if x.get("type") == "function_call"]
                      else:
                          conversation.append({"role": "assistant", "content": output})
                          calls = [x for x in output if x.get("type") == "tool_use"]
                      results = []
                      finish = [x for x in calls if x.get("name") == "finish_review"]
                      finish_error = None
                      if finish:
                          try:
                              value = json.loads(finish[0]["arguments"]) if self.family == "astra" else finish[0]["input"]
                              self.invalid_finish = json.loads(json.dumps(value))
                              record(self.family + '-delivered-final.json', value)
                              if len(calls) != 1:
                                  raise ValueError("Final review requires no concurrent tool calls")
                              value = validate_review(value, set(self.prior), self.overrides, allow_incomplete=self.finish_now,
                                                      retained_findings=self.retained_pending_findings(value))
                              if (not self.history_read or not self.reads) and not (self.finish_now and value['decision'] == 'changes_requested'):
                                  raise ValueError("Final review requires prior source/history reads")
                              if not self.history_read:
                                  for item in value['prior_findings']:
                                      item.update(resolution='unresolved', reason=
                                                  'Earlier finding history was not admitted to this review. Its disposition remains unresolved.')
                              record(self.family + "-source-reads.json", self.reads)
                              self.invalid_finish = None
                              self.delivered_finals.clear()
                              return value
                          except (ValueError, TypeError, KeyError) as error:
                              self.remember_delivered()
                              finish_error = ('Final report was not accepted: '+str(error)+'. Correct the form and resubmit finish_review. Retain each pending fresh finding or explicitly disposition its full ID. Earlier IDs, including unsuccessful deliveries: '+json.dumps(sorted(self.prior)))
                              record(self.family+'-final-validation-error.json', {'error': str(error)})
                      if not calls and stop_reason != "pause_turn":
                          # A paused server-tool turn is resumed with its assistant
                          # message unchanged, with no inserted user message.
                          conversation.append({"role": "user", "content": "Continue the review. When finished use finish_review; prose alone cannot pass the gate."})
                      # Reserve a small error result for every pending call before admitting
                      # large reads. Parallel calls share one next-request budget.
                      notice = ('Estimated remaining allowance; 64,000 tokens are reserved for the reviewer\'s own output. '
                                'Use smaller reads or narrower searches. Repository reads are never truncated.')
                      web_remaining = web_allowance(self.family, conversation)
                      rejected = {'error': 'Read too large for the remaining review allowance. Request fewer lines or a narrower result.',
                                  'remaining_context_tokens': 0, 'remaining_tool_characters': 0,
                                  'budget_notice': notice, 'web_uses_remaining': web_remaining}
                      values = [dict(rejected) for _ in calls]

                      def next_conversation(proposed):
                          if self.family == 'astra':
                              return conversation + [
                                  {'type': 'function_call_output', 'call_id': c['call_id'],
                                   'output': json.dumps(v, ensure_ascii=False)} for c, v in zip(calls, proposed)]
                          return conversation + [{'role': 'user', 'content': [
                              {'type': 'tool_result', 'tool_use_id': c['id'],
                               'content': json.dumps(v, ensure_ascii=False)} for c, v in zip(calls, proposed)]}]

                      def allowance(proposed):
                          estimated = context_estimate(self.family, instructions,
                                                       next_conversation(proposed), previous)
                          # Leave space for allowance metadata and a recovery/decision turn.
                          return max(0, CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE - estimated['estimated_total'])

                      for call_index, call in enumerate(calls):
                          args = json.loads(call["arguments"]) if self.family == "astra" else call["input"]
                          reads_before, history_before = len(self.reads), self.history_read
                          try:
                              if call["name"] == 'finish_review' and finish_error:
                                  value = {'error': finish_error}
                              elif self.finish_now:
                                  raise ValueError('Read too large for the remaining review allowance. ' + FINISH_NOW_INSTRUCTION)
                              else:
                                  value = self.tool(call["name"], args)
                          except (ValueError, UnicodeError) as error:
                              value = {"error": str(error)}
                          value = {**value, 'remaining_context_tokens': 0,
                                   'remaining_tool_characters': 0, 'budget_notice': notice, 'web_uses_remaining': web_remaining}
                          values[call_index] = value
                          estimated = context_estimate(self.family, instructions,
                                                       next_conversation(values), previous)
                          content = json.dumps(value, ensure_ascii=False)
                          # In addition to the next request's output allowance, leave room
                          # for that reply to enter the following request's input context.
                          if (estimated['estimated_total'] > CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE - REVIEWER_OUTPUT_RESERVE
                                  or self.chars + len(content) + 128 > TOOL_CHARACTER_BUDGET):
                              value = dict(rejected)
                              values[call_index] = value
                              # Fetching a source is not evidence that the reviewer saw it.
                              del self.reads[reads_before:]
                              self.history_read = history_before
                          value['remaining_context_tokens'] = max(0, allowance(values) - 128)
                          if self.finish_now or value['remaining_context_tokens'] < REVIEWER_OUTPUT_RESERVE:
                              self.finish_now = True
                              value['finish_now'] = True
                              value['budget_notice'] = FINISH_NOW_INSTRUCTION
                          value['remaining_tool_characters'] = max(0, TOOL_CHARACTER_BUDGET - self.chars - len(json.dumps(value, ensure_ascii=False)) - 128)
                          content = json.dumps(value, ensure_ascii=False)
                          self.chars += len(content)
                          record(self.family + f"-tool-{turn}-{call_index}.json", {"name": call["name"], "arguments": args, "result": value})
                      if calls:
                          conversation = next_conversation(values)
                  raise RuntimeError("50 model turns exhausted; no acceptance")


          def finding_id(report, local_id):
              return f"{report['run']}-{report['attempt']}-{report['reviewer']}-{local_id}"


          def own_comment(gh, comment):
              return comment["user"]["login"] == "github-actions[bot]"


          def history(gh, pr, known=None):
              comments = gh.pages(f"/issues/{pr['number']}/comments")
              discussion = [{"id": c["id"], "author": c["user"]["login"], "created": c["created_at"], "body": c["body"]}
                            for c in comments if not (own_comment(gh, c) and c["body"].startswith((MARKER, WORKING_MARKER, SUMMARY_MARKER, "<!-- protocol-b-working-note -->")))]
              for endpoint in ("reviews", "comments"):
                  discussion.extend(gh.pages(f"/pulls/{pr['number']}/" + endpoint))
              prior, overrides, latest, completed_runs = dict(known or {}), {}, {}, set()
              for comment in comments:
                  body = comment["body"]
                  if body.startswith(MARKER) and own_comment(gh, comment):
                      # Earlier verdicts never count as approval of this revision. All
                      # objections, including previously resolved ones, are shown again.
                      match = re.search(r"```json\n(.*)\n```", body, re.S)
                      if match is None:
                          raise ValueError("Earlier gate report is malformed; recover it rather than discard its findings")
                      report = json.loads(match[1])
                      if report.get('complete') and source_evidence(report):
                          discussion.append({'review_source_checks': [s['check'] for s in source_evidence(report)],
                                             'review_source_evidence': source_evidence(report),
                                             'review_access_limitations': report['review'].get('access_limitations', []),
                                             'reviewer': report['reviewer'], 'head': report['head'],
                                             'review_run': report['run'], 'review_attempt': report['attempt']})
                      for finding in blocking_findings(report["review"]):
                          prior[finding_id(report, finding['id'])] = {**finding, 'report_comment': {
                              'id': comment['id'], 'url': comment.get('html_url'),
                              'sha256': hashlib.sha256(body.encode()).hexdigest()}}
                      scope = review_scope_item(report)
                      if scope:
                          prior[scope['id']] = scope
                      key = (report['run'], report['attempt'], report['reviewer'])
                      if report.get('complete'):
                          completed_runs.add(key)
                      if report.get('head') == pr['head']['sha']:
                          latest[report['reviewer']] = report
              for comment in comments:
                  if own_comment(gh, comment) and comment['body'].startswith(WORKING_MARKER):
                      working = json.loads(re.search(r"```json\n(.*)\n```", comment['body'], re.S)[1])
                      if (working['run'], working['attempt'], working['reviewer']) not in completed_runs:
                          # A failed or cancelled review's actual observations survive.
                          # Do not turn an HTTP outage without observations into a
                          # permanent mathematical objection.
                          discussion.append({'incomplete_review': working, 'source': comment.get('html_url')})
              pattern = re.compile(r"^/protocol-b override ([0-9a-f]{40}) ([A-Za-z0-9_-]+)\s+(.+)$", re.S)
              for comment in comments:
                  match = pattern.fullmatch(comment["body"].strip())
                  if match and match[1] == pr["head"]["sha"] and (match[2] in prior or re.fullmatch(r"scope-[0-9]+-[0-9]+-(astra|fable)", match[2])):
                      login = comment["user"]["login"]
                      if administrator(gh, comment["user"]) and unedited_override_comment(gh, comment):
                          overrides[match[2]] = {"collaborator": login, "reason": match[3], "url": comment["html_url"]}
              return discussion, prior, overrides, latest


          def review_scope_item(envelope):
              """An administrative coverage item, never a claim that the mathematics is false."""
              if envelope.get('scope_coverage'):
                  return envelope['scope_coverage']
              value = envelope.get('review', {})
              reasons = []
              if envelope.get('post_review_error'):
                  reasons.append('Required review metadata was not completed: '+envelope['post_review_error'])
              if not envelope.get('complete'):
                  reasons.append('The review did not complete.')
              if value.get('scope_complete') is False:
                  reasons.append('The reviewer reported incomplete coverage.')
              if envelope.get('read_prerequisites_complete') is False:
                  reasons.append('Required source or history reads were not completed.')
              if envelope.get('finished_early') and value.get('decision') != 'accept':
                  reasons.append('The review stopped at its context limit.')
              active = blocking_findings(value) or any(f['resolution'] != 'resolved' for f in value.get('prior_findings', []))
              notes = any(f.get('severity') == 'note' for f in value.get('findings', [])) or envelope.get('nonblocking_notes_omitted', {}).get('count', 0) > 0
              if value.get('decision') not in {'accept', 'not_reviewed'} and not active and not notes:
                  reasons.append('The reviewer rejected without an itemized blocking finding.')
              if not reasons:
                  return None
              unread = value.get('not_reviewed') or [
                  'The unreviewed scope was not itemized; the original report and diagnostic records remain authoritative.']
              encoded = json.dumps(unread, ensure_ascii=False).encode()
              scope = {'id': 'scope-'+str(envelope['run'])+'-'+str(envelope['attempt'])+'-'+envelope['reviewer'],
                       'kind': 'review_scope', 'location': envelope['reviewer']+' review coverage',
                       'objection': ' '.join(reasons), 'not_reviewed': unread,
                       'original_run': str(envelope['run']), 'reviewer': envelope['reviewer']}
              if len(encoded) > 6_000:
                  # Coverage remains explicitly incomplete. Full text is preserved in
                  # the original report/artifact, with a binding hash in the App record.
                  scope['not_reviewed'] = ['Coverage list exceeds the App summary allowance; see the full original report and run artifact.']
                  scope['coverage_omitted'] = {'sha256': hashlib.sha256(encoded).hexdigest(),
                      'items': len(unread), 'bytes': len(encoded),
                      'run': str(envelope['run']), 'attempt': str(envelope['attempt']),
                      'artifact_file': envelope['reviewer']+('-report.json' if envelope.get('complete') else '-failure.json')}
              return scope


          def obligation_event(envelope, kind, item, resolution=''):
              origin = tuple(str(envelope.get(k, '')) for k in ('run', 'attempt', 'reviewer', 'head'))
              return hashlib.sha256(json.dumps([origin, kind, resolution, item], sort_keys=True).encode()).hexdigest()


          def obligation_sources(item):
              return item.get('occurrences', [item])


          def pack_obligation(items):
              if len(items) == 1:
                  return items[0]
              return {**items[0], 'occurrences': items,
                      'reason': '\n'.join(i['origin_reviewer']+': '+i['reason'] for i in items)}


          def historical_obligations(candidates, current=None):
              """Preserve App-authenticated findings across heads and empty later records."""
              states, applied = {}, set()
              pairs = [pair for _, pair in sorted(candidates, key=lambda item: item[0])] + [current or {}]
              for pair in pairs:
                  for family, envelope in pair.items():
                      value = envelope.get('review', {})
                      for ident, item in envelope.get('carried_findings', {}).items():
                          for source in obligation_sources(item):
                              states.setdefault((source['origin_reviewer'], ident), source)
                      for f in blocking_findings(value):
                          event = obligation_event(envelope, 'finding', f)
                          if event in applied:
                              continue
                          applied.add(event)
                          ident = finding_id(envelope, f['id'])
                          states[family, ident] = {'origin_reviewer': family,
                              'resolution': 'unresolved', 'reason': f.get('objection', ''), 'observation': event}
                      for f in value.get('prior_findings', []):
                          # An incomplete execution cannot silently resolve old objections.
                          resolution = f['resolution'] if envelope.get('complete') and envelope.get('read_prerequisites_complete') is not False else 'unresolved'
                          event = obligation_event(envelope, 'prior', f, resolution)
                          if event in applied:
                              continue
                          # Reusing or copying an old report is not a new resolution.
                          # Its original disposition cannot erase a later reopening.
                          applied.add(event)
                          states[family, f['id']] = {'origin_reviewer': family,
                              'resolution': resolution, 'reason': f.get('reason', ''), 'observation': event}
                          if resolution == 'resolved' and ('history', f['id']) in states:
                              states['history', f['id']] = {'origin_reviewer': 'history',
                                  'resolution': 'resolved', 'reason': f.get('reason', '')}
              active = {}
              for (_, ident), item in states.items():
                  if item['resolution'] != 'resolved':
                      active.setdefault(ident, []).append(item)
              return {ident: pack_obligation(items) for ident, items in active.items()}


          def carry_obligations(reports, candidates):
              obligations = historical_obligations(candidates, reports)
              explicit, explicit_ids = set(), set()
              for envelope in reports.values():
                  for f in blocking_findings(envelope.get('review', {})):
                      explicit.add(obligation_event(envelope, 'finding', f))
                      explicit_ids.add(finding_id(envelope, f['id']))
                  for f in envelope.get('review', {}).get('prior_findings', []):
                      if f['resolution'] != 'resolved':
                          explicit.add(obligation_event(envelope, 'prior', f, f['resolution'] if envelope.get('complete') and envelope.get('read_prerequisites_complete') is not False else 'unresolved'))
                          explicit_ids.add(f['id'])
                  envelope.pop('carried_findings', None)
              if reports:
                  # Preserve omitted objections even when all current reports completed.
                  target = next((e for e in reports.values() if review_scope_item(e)), next(iter(reports.values())))
                  retained = {}
                  for ident, item in obligations.items():
                      missing = [source for source in obligation_sources(item)
                                 if source.get('observation') not in explicit
                                 and not (source['origin_reviewer'] == 'history' and ident in explicit_ids)]
                      if missing:
                          retained[ident] = pack_obligation(missing)
                  if retained:
                      target['carried_findings'] = retained
              return obligations


          def ensure_scope_records(state, previous=None, candidates=None):
              """Record absent reviews as absent; never manufacture a model execution or verdict."""
              for family in MODELS:
                  prior = (previous or {}).get(family)
                  if family not in state['reports'] and prior and effective_head(prior) == state['head']:
                      # A skipped later run must not erase an earlier authentic rejection.
                      state['reports'][family] = json.loads(json.dumps(prior))
                  current = state['reports'].get(family)
                  if (current and not current.get('complete') and prior
                          and effective_head(prior) == state['head']):
                      # An interrupted replacement did not resolve the earlier objections.
                      carried = {finding_id(prior, f['id']): f.get('objection', '')
                                 for f in blocking_findings(prior['review'])}
                      carried.update({f['id']: f.get('reason', '')
                                      for f in prior['review'].get('prior_findings', [])
                                      if f['resolution'] != 'resolved'})
                      existing = {f['id'] for f in current['review'].get('prior_findings', [])}
                      current['review'].setdefault('prior_findings', []).extend(
                          {'id': ident, 'resolution': 'unresolved',
                           'reason': 'Retained from the earlier App record; the interrupted review did not resolve it. '+reason}
                          for ident, reason in sorted(carried.items()) if ident not in existing)
                  if family not in state['reports']:
                      state['reports'][family] = {
                          'reviewer': family, 'model': MODELS[family], 'reported_model': None,
                          'runtime_scope_record': True, 'complete': False,
                          'head': state['head'], 'policy_ref': state['policy_ref'],
                          'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                          'review': {'decision': 'not_reviewed', 'scope_complete': False,
                                     'report': 'Runtime record of an absent review, not a model verdict.',
                                     'not_reviewed': ['No completed '+family+' review was produced. '+state.get('summary', '')],
                                     'findings': [], 'prior_findings': []}}
              carry_obligations(state['reports'], [(0, previous or {})] + list(candidates or []))
              state['scope_items'] = [item for e in state['reports'].values() if (item := review_scope_item(e))]


          def unmatched_report_claims(gh, pr, candidates, current):
              """Unverified occurrences need their own disposition, not an older ID's resolution."""
              known, recorded = set(), {}
              for pair in [pair for _, pair in candidates] + [current]:
                  for envelope in pair.values():
                      known.update(finding_id(envelope, f['id']) for f in blocking_findings(envelope.get('review', {})))
                      known.update(f['id'] for f in envelope.get('review', {}).get('prior_findings', []))
                      known.update(envelope.get('carried_findings', {}))
                      key = tuple(str(envelope.get(k, '')) for k in ('run', 'attempt', 'reviewer', 'head'))
                      recorded.setdefault(key, []).extend(envelope.get('review', {}).get('prior_findings', []))
              prior = history(gh, pr)[1]
              claims = {ident: {'origin_reviewer': 'history', 'resolution': 'unresolved',
                      'reason': 'Unverified report-comment claim, not authenticated model identity: '+str(finding.get('objection', '')),
                      'report_comment': finding.get('report_comment')}
                      for ident, finding in prior.items() if ident not in known and finding.get('report_comment')}
              for comment in gh.pages(f'/issues/{pr["number"]}/comments'):
                  if not own_comment(gh, comment) or not comment['body'].startswith(MARKER):
                      continue
                  match = re.search(r"```json\n(.*)\n```", comment['body'], re.S)
                  if not match:
                      raise ValueError('Malformed report comment; recover its observations')
                  report = json.loads(match[1])
                  key = tuple(str(report.get(k, '')) for k in ('run', 'attempt', 'reviewer', 'head'))
                  dispositions = report.get('review', {}).get('prior_findings', [])
                  if not isinstance(dispositions, list):
                      raise ValueError('Malformed report-comment dispositions; recover its observations')
                  for item in dispositions:
                      if (not isinstance(item, dict) or not isinstance(item.get('id'), str)
                              or not re.fullmatch(r'[A-Za-z0-9_-]+', item['id']) or item.get('resolution') == 'resolved'):
                          continue
                      # Only the actual App envelope covering this exact occurrence can
                      # subsume it. A different run's resolution of the same ID cannot.
                      if item in recorded.get(key, []):
                          continue
                      digest = hashlib.sha256(json.dumps(item, sort_keys=True, ensure_ascii=False).encode()).hexdigest()
                      ident = 'comment-'+str(comment['id'])+'-'+digest
                      if ident in known:
                          continue  # Its own App-recorded disposition is tracked by the closure.
                      claims[ident] = {'origin_reviewer': 'history', 'resolution': 'unresolved',
                          'original_finding': item['id'],
                          'reason': 'Unverified report-comment occurrence reopens '+item['id']+': '+str(item.get('reason', 'No reason supplied.')),
                          'report_comment': {'id': comment['id'], 'url': comment.get('html_url'),
                              'sha256': hashlib.sha256(comment['body'].encode()).hexdigest()}}
              return claims


          def reconcile_obligations(gh, pr, reports, candidates):
              candidates = list(candidates)
              unknown = unmatched_report_claims(gh, pr, candidates, reports)
              if unknown:
                  candidates.append((-1, {'history': {'review': {'findings': [], 'prior_findings': []}, 'carried_findings': unknown}}))
              return carry_obligations(reports, candidates)


          def unaddressed_findings(reports, prior):
              addressed = {f['id'] for e in reports.values() for f in e['review'].get('prior_findings', [])}
              addressed.update(finding_id(e, f['id']) for e in reports.values() for f in blocking_findings(e['review']))
              return set(prior) - addressed


          def deliver_review_report(gh, pr, envelope, retry=False):
              """Retain the verdict; disclose delivery status and reconcile before retry."""
              value = {k: v for k, v in envelope.items() if k != 'report_publication'}
              url = f'https://github.com/{gh.repo}/actions/runs/{envelope["run"]}'
              body = MARKER + '\n' + url + '\n```json\n' + json.dumps(value, ensure_ascii=False) + '\n```'
              digest = hashlib.sha256(body.encode()).hexdigest()
              try:
                  if retry:
                      attempted = envelope.get('report_publication', {}).get('sha256', digest)
                      for c in gh.pages(f'/issues/{pr["number"]}/comments'):
                          if own_comment(gh, c) and hashlib.sha256(c['body'].encode()).hexdigest() == attempted:
                              envelope['report_publication'] = {'status': 'posted', 'comment': c['id'], 'sha256': attempted}
                              return
                      required = ('report', 'sources_read') if envelope.get('complete') else ('report',)
                      if (not all(k in envelope.get('review', {}) for k in required)
                              or envelope.get('nonblocking_notes_omitted')):
                          raise ValueError('Full original report is absent from this compact App record; recover its original run artifact. A compact record cannot be published as the original review.')
                  response = gh.call(f'/issues/{pr["number"]}/comments', 'POST', {'body': body})
                  envelope['report_publication'] = {'status': 'posted', 'comment': response['id'], 'sha256': digest}
              except Exception as error:
                  original_digest = envelope.get('report_publication', {}).get('sha256', digest) if retry else digest
                  envelope['report_publication'] = {'status': 'failed', 'error': str(error), 'sha256': original_digest,
                      'original_report': url + '/attempts/' + str(envelope['attempt']),
                      'artifact_file': envelope['reviewer']+('-report.json' if envelope.get('complete') else '-failure.json')}
                  record(envelope['reviewer']+'-publication-error.json', envelope['report_publication'])
                  log(envelope['reviewer']+': original verdict retained; report delivery failed: '+str(error))


          def inherit_report_publications(envelope, previous):
              """A supplement does not replace the proof report on which it relies."""
              obligations = list(previous.get('retained_report_publications', []))
              if previous.get('report_publication', {}).get('status') == 'failed':
                  obligations.append({k: previous[k] for k in
                      ('reviewer', 'head', 'run', 'attempt', 'report_publication')})
              if obligations:
                  envelope['retained_report_publications'] = json.loads(json.dumps(obligations))


          def reconcile_report_publications(gh, pr, envelope):
              obligations = envelope.get('retained_report_publications', [])
              if not any(o['report_publication']['status'] == 'failed' for o in obligations):
                  return
              try:
                  comments = {hashlib.sha256(c['body'].encode()).hexdigest(): c['id']
                      for c in gh.pages(f'/issues/{pr["number"]}/comments') if own_comment(gh, c)}
                  for obligation in obligations:
                      publication = obligation['report_publication']
                      if publication['status'] == 'failed' and publication['sha256'] in comments:
                          publication.update(status='posted', comment=comments[publication['sha256']])
              except Exception as error:
                  # Keep the original identity/hash and failed status on a read failure.
                  envelope['retained_publication_error'] = str(error)


          def administrator(gh, user):
              if user.get('type') != 'User' or not user.get('login'):
                  return False
              try:
                  permission = gh.call('/collaborators/'+urllib.parse.quote(user['login'], safe='')+'/permission')
              except RequestError as error:
                  if error.status == 404:
                      return False
                  raise
              return permission['permission'] == 'admin'


          def unedited_override_comment(gh, comment):
              """An original author is not authority for a body another writer edited."""
              if (not comment.get('node_id') or not comment.get('created_at')
                      or comment.get('updated_at') != comment['created_at']):
                  return False
              result = gh.api('/graphql', 'POST', {
                  'query': 'query($id:ID!){node(id:$id){__typename ... on IssueComment{id body author{login} lastEditedAt editor{login}}}}',
                  'variables': {'id': comment['node_id']}})
              if result.get('errors'):
                  return False
              node = (result.get('data') or {}).get('node') or {}
              return (node.get('__typename') == 'IssueComment' and node.get('id') == comment['node_id']
                      and 'lastEditedAt' in node and node['lastEditedAt'] is None
                      and 'editor' in node and node['editor'] is None
                      and node.get('body') == comment['body']
                      and (node.get('author') or {}).get('login') == comment['user']['login'])


          def override_findings(latest, head):
              """Validate the trusted reports before classifying their findings."""
              if set(latest) != set(MODELS):
                  raise ValueError("Override needs the App records for both reviewers on this head")
              unresolved = set()
              for family, envelope in latest.items():
                  if (envelope.get('reused_for', envelope.get('head')) != head
                          or envelope.get('model') != MODELS[family] or envelope.get('identity_error')):
                      raise ValueError("Override cannot replace a stale or wrong-model review")
                  value = envelope['review']
                  here = {finding_id(envelope, f['id']) for f in blocking_findings(value)}
                  here.update(f['id'] for f in value['prior_findings'] if f['resolution'] != 'resolved')
                  here.update(envelope.get('carried_findings', {}))
                  scope = review_scope_item(envelope)
                  if scope:
                      here.add(scope['id'])
                  unresolved.update(here)
              return unresolved


          def overridden_decision(latest, overrides, head):
              """A repository admin, not a reviewer model, decides a covered deadlock."""
              unresolved = override_findings(latest, head)
              relieved = {item['finding'] for item in qualified_access_findings(latest, include_overridden=True)}
              missing = unresolved - relieved - set(overrides)
              if missing:
                  raise ValueError("Uncovered findings: " + ", ".join(sorted(missing)))
              if not unresolved - relieved:
                  raise ValueError("No deadlock needs overriding; request an ordinary review")
              return {key: overrides[key] for key in sorted(unresolved - relieved)}


          def same_policy(gh, previous, current):
              return all(gh.text(path, previous) == gh.text(path, current) for path in (WORKFLOW, INSTRUCTIONS))


          def findings_summary(reports):
              rows = []
              for envelope in reports.values():
                  scope = review_scope_item(envelope)
                  if scope:
                      rows.append(f"- `{scope['id']}`: incomplete review scope: {scope['objection']}")
                  for ident, item in envelope.get('carried_findings', {}).items():
                      rows.append(f"- `{ident}`: retained earlier finding: {item['reason']}")
                  for finding in blocking_findings(envelope['review']):
                      rows.append(f"- `{finding_id(envelope, finding['id'])}`: {finding.get('location', '')}: {finding.get('objection', '')}")
                  for prior in envelope['review'].get('prior_findings', []):
                      if prior['resolution'] == 'unresolved':
                          rows.append(f"- `{prior['id']}`: {prior['reason']}")
              return "\n\nFinding IDs for collaborator decisions:\n" + "\n".join(dict.fromkeys(rows)) if rows else ""


          def trusted_reports(app, pr, name, exclude):
              """Override authority comes from this App's own check, never a bot comment."""
              candidates = []
              for page in range(1, 101):
                  response = app.call(f"/commits/{pr['head']['sha']}/check-runs?filter=all&per_page=100&page={page}")
                  for check in response['check_runs']:
                      if (check['id'] != exclude and check['name'] == name and
                              (check.get('app') or {}).get('id') == int(os.environ['APP_ID']) and
                              (check.get('output', {}).get('text') or '').startswith('{')):
                          value = json.loads(check['output']['text'])
                          if value.get('schema') == 'protocol-b-decisions/v1' and value.get('head') == pr['head']['sha']:
                              if value.get('reports'):
                                  candidates.append((check['id'], value['reports']))
                  if len(response['check_runs']) < 100:
                      return max(candidates, default=(0, {}))[1]
              raise ValueError('Too many prior checks; no partial override decision')


          def start_clients():
              gh = GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
              app_id = int(os.environ['APP_ID'])
              if app_id <= 0 or app_id == 15368:
                  raise ValueError('A dedicated App ID is required; GitHub Actions is not the review identity')
              app = GitHub(gh.repo, os.environ['APP_TOKEN'])
              return gh, app


          def collaborator(gh, user):
              if user.get('type') != 'User' or not user.get('login'):
                  return False
              try:
                  permission = gh.call('/collaborators/' + urllib.parse.quote(user['login'], safe='') + '/permission')
              except RequestError as error:
                  if error.status == 404:
                      return False
                  raise
              return permission['permission'] in {'write', 'maintain', 'admin'}


          def diff_identity(files):
              """Bind the complete change, ignoring only hunk line numbers after a rebase."""
              rows = []
              for f in files:
                  patch = f.get('patch')
                  if not isinstance(patch, str):
                      return None
                  lines = patch.splitlines()
                  if (sum(s.startswith('+') for s in lines) != f['additions'] or
                          sum(s.startswith('-') for s in lines) != f['deletions']):
                      return None
                  normalized = [re.sub(r'^@@ -\d+(?:,\d+)? \+\d+(?:,\d+)? @@', '@@ @@', s)
                                if s.startswith('@@ ') else s for s in lines]
                  rows.append([f['filename'], f.get('previous_filename'), f['status'],
                               f['additions'], f['deletions'], normalized])
              return hashlib.sha256(json.dumps(sorted(rows), ensure_ascii=False).encode()).hexdigest()


          def source_identity(gh, path, ref):
              value = gh.call('/contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + ref)
              if not isinstance(value, dict) or value.get('type') != 'file' or not re.fullmatch('[0-9a-f]{40}', value.get('sha', '')):
                  raise ValueError('Cannot bind review source ' + path)
              return value['sha']


          def passage_digest(lines):
              return hashlib.sha256(json.dumps(lines, ensure_ascii=False).encode()).hexdigest()


          def reuse_refs(gh, pr, with_merge_base):
              refs = {side: pr[side]['sha'] for side in ('base', 'head')}
              if with_merge_base:
                  comparison = gh.call('/compare/' + refs['base'] + '...' + refs['head'])
                  merge_base = comparison.get('merge_base_commit', {}).get('sha', '')
                  if not re.fullmatch('[0-9a-f]{40}', merge_base):
                      raise ValueError('Cannot bind the PR diff merge base')
                  refs['merge_base'] = merge_base
              return refs


          def displayed_hunk_reads(gh, files, refs, texts):
              """Check displayed lines against their actual refs before caching them."""
              reads = []
              for file in files:
                  patch = file.get('patch', '')
                  hunks = list(re.finditer(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@[^\n]*(?:\n|$)', patch, re.M))
                  if patch and (not hunks or hunks[0].start() != 0):
                      raise ValueError('Cannot identify every displayed diff hunk')
                  for index, match in enumerate(hunks):
                      end = hunks[index + 1].start() if index + 1 < len(hunks) else len(patch)
                      sides = {'merge_base': [], 'head': []}
                      for line in patch[match.end():end].splitlines():
                          if line == '\\ No newline at end of file':
                              continue
                          if not line or line[0] not in ' +-':
                              raise ValueError('Malformed displayed diff line')
                          if line[0] in ' -':
                              sides['merge_base'].append(line[1:])
                          if line[0] in ' +':
                              sides['head'].append(line[1:])
                      for side, start, count in (('merge_base', int(match[1]), int(match[2] or 1)),
                                                 ('head', int(match[3]), int(match[4] or 1))):
                          value = sides[side]
                          if len(value) != count or (count and start < 1):
                              raise ValueError('Displayed hunk range does not match its lines')
                          if not count:
                              continue  # The absent side of an added/deleted file has no passage.
                          path = file.get('previous_filename', file['filename']) if side == 'merge_base' else file['filename']
                          key = (path, refs[side])
                          if key not in texts:
                              texts[key] = gh.text(*key).splitlines()
                          if texts[key][start-1:start-1+count] != value:
                              raise ValueError('Displayed hunk differs from its pinned source')
                          reads.append({'path': path, 'revision': side, 'ref': refs[side],
                                        'start': start, 'count': count})
              return reads


          def make_reuse_binding(gh, pr, files, reviewer):
              packet = reviewer.initial_packet or {}
              if packet.get('patches_deferred') and packet.get('merge_base') != pr['base']['sha']:
                  raise ValueError('Deferred merge-base context may be read through untracked web tools; cross-head reuse disabled on a diverged base')
              # Text dependencies follow the exact returned passage across line movement.
              # Binary dependencies and trusted policy inputs require whole-file equality.
              whole = set(reviewer.binary_dependencies)
              whole.update((p, 'base') for p in (WORKFLOW, INSTRUCTIONS, 'PROJECT.md', 'docs/research-review/README.md'))
              sources = [{'path': p, 'revision': side, 'sha': source_identity(gh, p, pr[side]['sha'])}
                         for p, side in sorted(whole)]
              identity = diff_identity(files)
              if identity is None:
                  raise ValueError('Cannot bind an incomplete PR diff')
              if hashlib.sha256(json.dumps(files, sort_keys=True).encode()).hexdigest() != reviewer.original_files_digest:
                  raise ValueError('PR diff changed after the reviewer input was prepared')
              refs = reuse_refs(gh, pr, any(f.get('patch') for f in files))
              texts = dict(reviewer.file_lines)
              passages, reads = [], []
              for read in reviewer.reads:
                  side = next((s for s in ('base', 'head') if read['revision'] == refs[s]), None)
                  if side is None:
                      raise ValueError('Unrecognized repository read revision')
                  reads.append({**read, 'revision': side, 'ref': refs[side]})
              # The initial diff is also source material, even without a read_file
              # call. GitHub's old side is the merge base, not the current base tip.
              reads.extend(displayed_hunk_reads(gh, reviewer.initial_files, refs, texts))
              for r in reads:
                  side = r['revision']
                  if (r['path'], side) in whole:
                      continue
                  key = (r['path'], r['ref'])
                  if key not in texts:
                      texts[key] = gh.text(*key).splitlines()
                  lines = texts[key]
                  value = lines[r['start']-1:r['start']-1+r['count']]
                  if not value:
                      # An empty/out-of-range read cannot be relocated reliably.
                      sources.append({'path': r['path'], 'revision': side,
                                       'sha': source_identity(gh, r['path'], r['ref'])})
                  else:
                      passages.append({'path': r['path'], 'revision': side, 'ref': r['ref'],
                                       'start': r['start'], 'count': len(value), 'digest': passage_digest(value)})
              return {'version': 3, 'number': pr['number'], 'diff': identity, 'sources': sources,
                      'merge_base': refs.get('merge_base'),
                      'passages': passages, 'discovery': reviewer.discovery}

          def optional_reuse_binding(gh, pr, files, reviewer):
              try:
                  return make_reuse_binding(gh, pr, files, reviewer)
              except Exception as error:
                  # Rebase caching is optional; never erase an actual completed
                  # verdict because a metadata request failed afterwards.
                  record(reviewer.family + '-reuse-binding-failure.json', {'error': str(error)})
                  return None


          def inherit_reuse_binding(current, retained):
              """A supplement can add dependencies, never discard the full proof's."""
              previous = retained.get('reuse_binding')
              if not current or not previous or any(current.get(k) != previous.get(k)
                                                     for k in ('version', 'number', 'diff')):
                  return None
              if current.get('version') != 3:
                  return None
              result = {**current}
              sources = {}
              for item in previous['sources'] + current['sources']:
                  key = (item['path'], item['revision'])
                  if key in sources and sources[key] != item:
                      return None
                  sources[key] = item
              result['sources'] = list(sources.values())
              passages = {json.dumps(p, sort_keys=True): p for p in previous.get('passages', []) + current.get('passages', [])}
              result['passages'] = list(passages.values())
              result['discovery'] = {**previous.get('discovery', {})}
              for query, digest in current.get('discovery', {}).items():
                  if query in result['discovery'] and result['discovery'][query] != digest:
                      return None
                  result['discovery'][query] = digest
              return result


          def source_evidence(envelope):
              """Retained attestations keep their provenance; later checks supersede them."""
              checks = {s['check']['source_id']: s for s in envelope.get('retained_source_evidence', [])}
              origin = {k: envelope[k] for k in ('reviewer', 'model', 'head', 'run', 'attempt', 'policy_ref')}
              for check in envelope['review'].get('source_checks', []):
                  checks[check['source_id']] = {'check': check, 'origin': origin}
              return list(checks.values())


          def retained_sources(previous, current):
              # Original full attestations remain in their reports. Keep only the
              # unsuperseded decision evidence and its original execution identity.
              replaced = {s['source_id'] for s in current.get('source_checks', [])}
              return [{'check': {k: s['check'][k] for k in ('source_id', 'outcome')},
                       'origin': s['origin']} for s in source_evidence(previous)
                      if s['check']['source_id'] not in replaced]


          def omit_retained_sources(envelope):
              record(envelope['reviewer'] + '-omitted-source-evidence.json', envelope['retained_source_evidence'])
              envelope['retained_source_evidence'] = []
              envelope['source_evidence_omitted'] = 'Output capacity; omitted attestations cannot authorize source-access relief.'


          def omit_current_sources(envelope):
              record(envelope['reviewer'] + '-omitted-current-source-checks.json', {
                  'origin': {k: envelope[k] for k in ('reviewer', 'model', 'head', 'run', 'attempt', 'policy_ref')},
                  'source_checks': envelope['review']['source_checks']})
              envelope['review']['source_checks'] = []
              # Removing a current withdrawal must not expose older verification.
              if envelope.get('retained_source_evidence'):
                  omit_retained_sources(envelope)
              envelope['source_evidence_omitted'] = 'Output capacity; current attestations and their inherited evidence omitted; no source-access relief from them.'


          def effective_head(envelope):
              # Callers obtain these envelopes from this App's authenticated check.
              return envelope.get('reused_for', envelope.get('head'))


          def reusable_on_rebase(gh, pr, files, envelope):
              packet = envelope.get('initial_packet') or {}
              if packet.get('patches_deferred') and packet.get('merge_base') != envelope.get('base'):
                  return False  # Required old-side web reads are not tracked by the binding.
              if any(f.get('resolution') == 'overridden' for f in envelope['review'].get('prior_findings', [])):
                  return False  # Overrides are authorized for one exact head only.
              binding = envelope.get('reuse_binding') or {}
              if (binding.get('version') != 3 or binding.get('number') != pr['number'] or
                      not binding.get('diff') or binding['diff'] != diff_identity(files) or
                      not binding.get('sources')):
                  return False
              try:
                  texts = {}
                  refs = reuse_refs(gh, pr, any(f.get('patch') for f in files) or any(
                      p['revision'] == 'merge_base' for p in binding.get('passages', []) + binding['sources']))
                  displayed_hunk_reads(gh, files, refs, texts)
                  def lines(path, ref):
                      if (path, ref) not in texts:
                          texts[path, ref] = gh.text(path, ref).splitlines()
                      return texts[path, ref]
                  for source in binding['sources']:
                      if source_identity(gh, source['path'], refs[source['revision']]) != source['sha']:
                          return False
                  for passage in binding.get('passages', []):
                      old = lines(passage['path'], passage['ref'])
                      value = old[passage['start']-1:passage['start']-1+passage['count']]
                      if not value or passage_digest(value) != passage['digest']:
                          return False
                      if sum(old[i:i+len(value)] == value for i, line in enumerate(old) if line == value[0]) != 1:
                          return False  # A surviving duplicate cannot identify the originally read occurrence.
                      new = lines(passage['path'], refs[passage['revision']])
                      matches = [i for i, line in enumerate(new) if line == value[0]
                                 and new[i:i+len(value)] == value]
                      if len(matches) != 1:
                          return False  # An ambiguous duplicate is not a source identity.
                  if binding.get('discovery'):
                      tree = gh.call('/git/trees/' + pr['head']['sha'] + '?recursive=1')
                      if tree.get('truncated'):
                          return False
                      paths = sorted(x['path'] for x in tree['tree'] if x['type'] == 'blob')
                      for query, digest in binding['discovery'].items():
                          found = [p for p in paths if query in p]
                          if hashlib.sha256(json.dumps(found).encode()).hexdigest() != digest:
                              return False
                  return True
              except (RequestError, ValueError, KeyError, OSError):
                  return False


          def reusable_reports(gh, pr, files, candidates, explicit_review=False, overrides=None, policy=None):
              selected = {}
              # The latest completed verdict per family supersedes earlier verdicts,
              # even across heads. A non-reusable rejection cannot revive an old accept.
              latest, first_seen = {}, {}
              for check_id, reports in sorted(candidates):
                  for family, e in reports.items():
                      if family in MODELS and e.get("complete") and e.get("model") == MODELS[family] and e.get('reviewer') == family:
                          origin = tuple(str(e.get(k, '')) for k in ('run', 'attempt', 'reviewer', 'head'))
                          order = first_seen.setdefault(origin, check_id)
                          if family not in latest or order >= latest[family][0]:
                              latest[family] = (order, check_id, e)
              for family, (_, check_id, envelope) in latest.items():
                  if (family not in MODELS or envelope.get('reviewer') != family or
                          envelope.get('model') != MODELS[family] or not envelope.get('complete') or
                          envelope.get('read_prerequisites_complete') is False):
                      continue
                  if not same_policy(gh, envelope['policy_ref'], policy or pr['base']['sha']):
                      continue
                  if any(f.get('resolution') == 'overridden' and f['id'] not in (overrides or {})
                         for f in envelope['review'].get('prior_findings', [])):
                      continue
                  accepted = envelope['review']['decision'] == 'accept'
                  if effective_head(envelope) != pr['head']['sha'] and not reusable_on_rebase(gh, pr, files, envelope):
                      continue
                  if not accepted and (explicit_review or effective_head(envelope) == pr['head']['sha']):
                      selected.pop(family, None)
                      continue
                  selected[family] = {**envelope, 'reused_for': pr['head']['sha'], 'reuse_check': check_id}
              return selected


          def history_coverage(discussion):
              observations = set()
              for item in discussion:
                  if 'review_source_checks' in item and 'review_run' in item:
                      continue  # Attestation metadata is not a new discussion objection.
                  body = item.get('body', '')
                  if body.strip() == '/protocol-b review' or re.fullmatch(
                          r'/protocol-b override [0-9a-f]{40} [A-Za-z0-9_-]+\s+.+', body.strip(), re.S):
                      continue  # Authorization commands are revalidated separately.
                  if item.get('author') == 'github-actions[bot]' and body.startswith((ROUND_MARKER, SUMMARY_MARKER,
                          'Accepted by collaborator override, not by unanimous model acceptance.',
                          'This override was ignored.')):
                      continue
                  if 'incomplete_review' in item:
                      value = item['incomplete_review']
                      stable = {k: value.get(k) for k in ('reviewer', 'head', 'run', 'attempt', 'notes')}
                  else:
                      stable = {k: item.get(k) for k in ('id', 'body', 'path', 'line', 'original_line', 'commit_id')}
                  observations.add(hashlib.sha256(json.dumps(stable, sort_keys=True, ensure_ascii=False).encode()).hexdigest())
              return observations


          def uncovered_history(envelopes, discussion):
              observations = history_coverage(discussion)
              digest = passage_digest(sorted(observations))
              if any(e.get('complete') and e.get('history_digest') == digest for e in envelopes.values()):
                  return set()
              return observations


          def bounded_report(envelope):
              # Rebase metadata is optional. Keep every finding and the paid verdict.
              if len(json.dumps(envelope, ensure_ascii=False).encode()) > 60_000 and envelope.get('reuse_binding'):
                  record(envelope['reviewer'] + '-omitted-rebase-binding.json', envelope['reuse_binding'])
                  envelope['reuse_binding'] = None
                  envelope['reuse_binding_omitted'] = 'Comment capacity; rebase reuse disabled.'
              if len(json.dumps(envelope, ensure_ascii=False).encode()) > 60_000 and envelope.get('retained_source_evidence'):
                  omit_retained_sources(envelope)
              if len(json.dumps(envelope, ensure_ascii=False).encode()) > 60_000 and envelope['review'].get('source_checks'):
                  omit_current_sources(envelope)
              return envelope


          def decision_text(state, reports, limits):
              compact = json.loads(json.dumps(reports))
              for e in compact.values():
                  if (scope := review_scope_item(e)):
                      e['scope_coverage'] = scope
                      if scope.get('coverage_omitted'):
                          e['review']['not_reviewed'] = scope['not_reviewed']
                  notes = [f for f in e['review']['findings'] if f.get('severity') == 'note']
                  if notes:
                      # The full original report is permanent in the PR and artifact.
                      # Notes cannot overflow the App payload and block acceptance.
                      e['nonblocking_notes_omitted'] = {
                          'count': len(notes),
                          'sha256': hashlib.sha256(json.dumps(notes, sort_keys=True, ensure_ascii=False).encode()).hexdigest(),
                          'location': ('Original run artifact; PR report delivery is unavailable.' if e.get('report_publication', {}).get('status') == 'failed' else 'Full original reviewer report on the PR and in its original run artifact.')}
                      e['review']['findings'] = blocking_findings(e['review'])
                  e['review'].pop('report', None)
                  e['review'].pop('sources_read', None)
              return json.dumps({'schema': 'protocol-b-decisions/v1', 'head': state['head'], 'reports': compact,
                                 'automatic_rounds': state.get('automatic_rounds', 0),
                                 'review_round': state.get('review_round'),
                                 'review_profile': state.get('review_profile'),
                                 'paid_rounds': state.get('paid_rounds', 0),
                                 'source_access_limitations': limits,
                                 'scope_overrides': state.get('scope_overrides', [])})


          def bounded_decision(state, envelopes, prior, discussion):
              accepted, limits = combined_decision(envelopes, prior, discussion)
              if len(decision_text(state, envelopes, limits).encode()) > 60_000:
                  for e in envelopes.values():
                      if e.get('reuse_binding'):
                          record(e['reviewer'] + '-omitted-rebase-binding.json', e['reuse_binding'])
                          e['reuse_binding'] = None
                          e['reuse_binding_omitted'] = 'App check capacity; rebase reuse disabled.'
              for e in sorted(envelopes.values(), key=lambda x: len(json.dumps(x.get('retained_source_evidence', []))), reverse=True):
                  if len(decision_text(state, envelopes, limits).encode()) <= 60_000:
                      break
                  if e.get('retained_source_evidence'):
                      omit_retained_sources(e)
                      # Removing evidence can remove access relief, never create it.
                      accepted, limits = combined_decision(envelopes, prior, discussion)
              for e in sorted(envelopes.values(), key=lambda x: len(json.dumps(x['review'].get('source_checks', []))), reverse=True):
                  if len(decision_text(state, envelopes, limits).encode()) <= 60_000:
                      break
                  if e['review'].get('source_checks'):
                      omit_current_sources(e)
                      accepted, limits = combined_decision(envelopes, prior, discussion)
              return accepted, limits


          def qualified_access_findings(envelopes, include_overridden=False):
              """Relief needs peer evidence for every unresolved occurrence of an ID."""
              if set(envelopes) != set(MODELS) or any(not e.get('complete') for e in envelopes.values()):
                  return []
              occurrences, qualified = {}, {}
              carried = {ident for e in envelopes.values() for ident in e.get('carried_findings', {})}
              for family, envelope in envelopes.items():
                  review = envelope['review']
                  unresolved = {finding_id(envelope, f['id']) for f in blocking_findings(review)}
                  unresolved.update(f['id'] for f in review['prior_findings']
                                    if f['resolution'] == 'unresolved' or
                                    (include_overridden and f['resolution'] == 'overridden'))
                  for ident in unresolved:
                      occurrences.setdefault(ident, []).append((family, ident))
                  if envelope.get('finished_early') or envelope.get('read_prerequisites_complete') is False:
                      continue
                  other = envelopes[next(f for f in MODELS if f != family)]
                  verified = {s['check']['source_id'] for s in source_evidence(other)
                              if s['check']['outcome'] == 'verified'}
                  for entry in review.get('access_limitations', []):
                      ident = entry['finding_id']
                      if ident not in unresolved:
                          ident = finding_id(envelope, ident)
                      if ident not in unresolved or not entry['source_ids'] or not set(entry['source_ids']) <= verified:
                          continue
                      qualified[(family, ident)] = {
                          'finding': ident, 'reviewer_unable_to_open': family,
                          'reviewer_who_checked': other['reviewer'], 'source_ids': entry['source_ids'],
                          'detail': entry['detail']}
              return [qualified[key] for ident in sorted(occurrences)
                      if ident not in carried and all(key in qualified for key in occurrences[ident])
                      for key in occurrences[ident]]


          def combined_decision(envelopes, prior=None, discussion=None):
              """Access-only findings remain recorded, with passage-specific peer evidence."""
              if set(envelopes) != set(MODELS) or any(not r.get('complete') for r in envelopes.values()):
                  return False, []
              if discussion is not None and uncovered_history(envelopes, discussion):
                  return False, []
              if unaddressed_findings(envelopes, prior or {}) or any(e.get('carried_findings') for e in envelopes.values()):
                  return False, []
              limits = qualified_access_findings(envelopes)
              for family, envelope in envelopes.items():
                  review = envelope['review']
                  if review.get('scope_complete', True) is not True:
                      return False, limits
                  if review['decision'] == 'accept':
                      continue
                  unresolved = {finding_id(envelope, f['id']) for f in blocking_findings(review)}
                  unresolved.update(f['id'] for f in review['prior_findings'] if f['resolution'] == 'unresolved')
                  if (not unresolved and review.get('scope_complete') is True
                          and (review['findings'] or envelope.get('nonblocking_notes_omitted', {}).get('count', 0) > 0)
                          and not envelope.get('finished_early') and envelope.get('read_prerequisites_complete') is not False):
                      # A fully reviewed change with only editorial notes meets the
                      # requirement. Keep the reviewer's original decision visible.
                      continue
                  if not unresolved or envelope.get('finished_early') or envelope.get('read_prerequisites_complete') is False:
                      return False, limits
                  covered = {item['finding'] for item in limits if item['reviewer_unable_to_open'] == family}
                  if not unresolved <= covered:
                      return False, limits
              return True, limits


          def review_spend_history(gh, app, pr, name, policy):
              """Comments only locate records; this App's check payload is authority.

              Persisting check pointers in the PR keeps counts across force-pushes.
              Old report comments also locate pre-counter reviews. A missing record
              fails closed rather than silently resetting the spending count.
              """
              heads, pointers = {pr['head']['sha']}, set()
              for comment in gh.pages(f"/issues/{pr['number']}/comments"):
                  body = comment['body']
                  if not own_comment(gh, comment) or not body.startswith((MARKER, ROUND_MARKER)):
                      continue
                  try:
                      value = json.loads(body.split('```json\n', 1)[1].split('\n```', 1)[0])
                  except (ValueError, IndexError):
                      continue
                  if body.startswith(ROUND_MARKER) and type(value.get('check')) is int:
                      pointers.add(value['check'])
                  elif re.fullmatch('[0-9a-f]{40}', str(value.get('head', ''))):
                      heads.add(value['head'])
              checks = {}
              for head in sorted(heads):
                  for page in range(1, 101):
                      response = app.call(f'/commits/{head}/check-runs?filter=all&per_page=100&page={page}')
                      for check in response['check_runs']:
                          checks[check['id']] = check
                      if len(response['check_runs']) < 100:
                          break
                  else:
                      raise ValueError('Prior review check pagination incomplete; no model call')
              for ident in sorted(pointers - checks.keys()):
                  checks[ident] = app.call(f'/check-runs/{ident}')
              rounds, paid_rounds, completed, candidates = set(), set(), [], []
              for check in checks.values():
                  if (check['name'] != name or (check.get('app') or {}).get('id') != int(os.environ['APP_ID'])):
                      continue
                  try:
                      value = json.loads(check.get('output', {}).get('text') or '{}')
                  except ValueError:
                      continue
                  if value.get('schema') != 'protocol-b-decisions/v1' or value.get('head') != check['head_sha']:
                      continue
                  marker = value.get('review_round') or {}
                  if marker.get('number') == pr['number'] and marker.get('started') is True:
                      paid_rounds.add((str(marker['run']), str(marker['attempt'])))
                      if marker.get('trigger') == 'automatic':
                          rounds.add((str(marker['run']), str(marker['attempt'])))
                  reports = value.get('reports') or {}
                  valid = (set(reports) == set(MODELS) and all(
                      r.get('reused_for', r.get('head')) == check['head_sha'] and r.get('model') == MODELS[f]
                      for f, r in reports.items()))
                  if valid and not marker and all(r.get('complete') and not r.get('runtime_scope_record') for r in reports.values()):
                      identities = {(str(r['run']), str(r['attempt'])) for r in reports.values()}
                      if len(identities) == 1:
                          run, attempt = next(iter(identities))
                          actual = gh.call(f'/actions/runs/{run}')
                          if actual['path'].split('@')[0] == WORKFLOW and any(not r.get('runtime_scope_record') for r in reports.values()):
                              paid_rounds.add((run, attempt))
                          if actual['event'] == 'pull_request_target' and actual['path'].split('@')[0] == WORKFLOW:
                              rounds.add((run, attempt))
                  # Comments locate candidates; only App-authenticated completed check
                  # payloads for this PR can supply review authority. Failed peer reviews
                  # do not erase a successfully completed acceptance.
                  if (check.get('status') == 'completed' and marker.get('number') == pr['number']):
                      eligible = {f: r for f, r in reports.items() if f in MODELS
                                  and r.get('reused_for', r.get('head')) == check['head_sha']
                                  and r.get('model') == MODELS[f] and r.get('reviewer') == f}
                      candidates.append((check['id'], eligible))
                  if (valid and check['head_sha'] == pr['head']['sha'] and check.get('status') == 'completed'
                          and all(r.get('complete') and same_policy(gh, r['policy_ref'], policy) for r in reports.values())):
                      completed.append(check)
              return {'automatic_rounds': len(rounds), 'paid_rounds': len(paid_rounds),
                      'completed_check': max(completed, key=lambda c: c['id']) if completed else None,
                      'candidates': candidates}


          def failed_computation_checks(gh, head, default):
              rules = gh.pages('/rules/branches/' + urllib.parse.quote(default, safe=''))
              requirements = [c for rule in rules if rule['type'] == 'required_status_checks'
                              for c in rule['parameters']['required_status_checks'] if c['context'] != CHECK]
              checks = head_checks(gh, head)
              statuses = {}
              for status in gh.pages(f'/commits/{head}/statuses'):
                  key = status['context'].casefold()
                  if key not in statuses or status['id'] > statuses[key]['id']:
                      statuses[key] = status
              failed = set()
              for required in requirements:
                  name, integration = required['context'], required.get('integration_id')
                  matches = [c for c in checks if c['name'] == name and
                             (integration in (None, -1) or (c.get('app') or {}).get('id') == integration)]
                  if any(c['status'] == 'completed' and c.get('conclusion') in
                         {'failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'} for c in matches):
                      failed.add(name)
                  if statuses.get(name.casefold(), {}).get('state') in {'error', 'failure'}:
                      failed.add(name)
              return sorted(failed)


          def main():
              mode = os.environ.get("MODE", "off")
              if mode not in {"test", "live"}:
                  log("Protocol B is inactive. No model requests, reports or merges.")
                  return
              event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              gh, app = start_clients()
              repo = gh.call("")
              default = repo["default_branch"]
              trusted_ref = gh.call("/commits/" + urllib.parse.quote(default, safe=""))["sha"]
              # Prevent a dispatch of a modified workflow from another branch. For
              # pull_request_target, GitHub runs the protected base's workflow by design.
              if os.environ["GITHUB_REF"] != "refs/heads/" + default:
                  raise ValueError("Gate must run from the default branch")
              number = (event.get("pull_request") or event.get("issue") or {}).get("number") or event.get("inputs", {}).get("pull_request")
              number = int(number)
              if mode == "test" and number != int(os.environ.get("TEST_PR", "0")):
                  log("Test mode: this is not the designated throwaway PR; no action.")
                  return
              override_command = review_command = False
              if "comment" in event:
                  command = event["comment"]["body"].strip()
                  if command != '/protocol-b review' and not command.startswith('/protocol-b override '):
                      return
                  login = event["sender"]["login"]
                  if event['comment']['user']['login'] != login or not collaborator(gh, event['comment']['user']):
                      return
                  override_command = command.startswith('/protocol-b override ')
                  if override_command and not administrator(gh, event['comment']['user']):
                      gh.call(f'/issues/{number}/comments', 'POST', {'body':
                          'This override was ignored. Only a repository admin may override a review item.'})
                      return
                  if override_command and not unedited_override_comment(gh, event['comment']):
                      gh.call(f'/issues/{number}/comments', 'POST', {'body':
                          'This override was ignored. Overrides must be new, unedited admin comments. Post a new comment instead of editing one.'})
                      return
                  review_command = command == '/protocol-b review'
              pr = gh.call(f"/pulls/{number}")
              if pr["state"] != "open" or pr["draft"] or pr["base"]["ref"] != default:
                  return
              # Refuse a runner executing superseded trusted code, before publishing a check.
              if not same_policy(gh, os.environ['GITHUB_SHA'], trusted_ref):
                  raise ValueError("Trusted workflow or instructions changed; start a fresh run")
              instructions = gh.text(INSTRUCTIONS, os.environ['GITHUB_SHA'])
              name = CHECK if mode == "live" else "Protocol B / test review"
              run_url = f"https://github.com/{gh.repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              spend = review_spend_history(gh, app, pr, name, trusted_ref)
              automatic = 'pull_request' in event and not review_command and not override_command
              stale_completed, cached_history_error = None, None
              if automatic and spend['completed_check']:
                  try:
                      cached = json.loads(spend['completed_check']['output']['text'])['reports']
                      pending = reconcile_obligations(gh, pr, cached, spend['candidates'])
                      discussion, prior, _, _ = history(gh, pr, {
                          ident: {'objection': item['reason'], **item} for ident, item in pending.items()})
                      if (any(e.get('carried_findings') for e in cached.values()) or
                              unaddressed_findings(cached, prior) or uncovered_history(cached, discussion)):
                          stale_completed = cached
                      else:
                          record('review-reused.json', {'check': spend['completed_check']['id'], 'head': pr['head']['sha'],
                                                       'automatic_rounds': spend['automatic_rounds'], 'model_calls': 0})
                          log('This head already has a completed review under the same policy; no model call.')
                          return
                  except Exception as error:
                      # A failed cache validation must replace, not leave effective,
                      # the old green check. Publish the failure without a model call.
                      cached_history_error = str(error)
              # Start blocked rather than leaving an indefinitely pending check if this
              # runner is cancelled, times out, or is lost. Finalization replaces this.
              check = app.call("/check-runs", "POST", {"name": name, "head_sha": pr["head"]["sha"],
                              "status": "completed", "conclusion": "action_required", "details_url": run_url,
                              "output": {"title": "Review not yet accepted", "summary": "The review is running. Only completed acceptance can replace this blocked state."}})
              if check['app']['id'] != int(os.environ['APP_ID']):
                  raise ValueError('Check was not created by the configured dedicated App')
              conclusion, summary = "failure", "Review did not finish. See the workflow log."
              state = {'number': number, 'head': pr['head']['sha'], 'base': pr['base']['sha'], 'check': check['id'],
                       'name': name, 'mode': mode, 'policy_ref': os.environ['GITHUB_SHA'], 'default': default,
                       'conclusion': conclusion, 'summary': summary, 'reports': {},
                       'automatic_rounds': spend['automatic_rounds'], 'prior_candidates': spend['candidates']}
              record('decision.json', state)
              envelopes = {}
              try:
                  if cached_history_error is not None:
                      raise ValueError('Could not validate completed-review history: '+cached_history_error)
                  if stale_completed is not None:
                      # Reopen/ready/synchronize must not leave an old green check
                      # effective after new objections, or silently spend on a repeat.
                      state.update(conclusion='action_required', reports=stale_completed, summary=
                          "Review blocked: new obligations or discussion after this head's completed review. A collaborator must comment /protocol-b review. No model was called.")
                      record('decision.json', state)
                      return
                  # Do not spend model credits on an outside contributor's automatic
                  # event or manual workflow dispatch. Each review needs a current
                  # collaborator's explicit command; an override never calls models.
                  if not override_command and not review_command and not collaborator(gh, pr['user']):
                      state.update(conclusion='action_required', summary=
                                   "Review blocked: awaiting a collaborator's /protocol-b review. No model was called.")
                      record('decision.json', state)
                      return
                  if not override_command:
                      failed = failed_computation_checks(gh, pr['head']['sha'], default)
                      if failed:
                          state.update(conclusion='action_required', summary='Review blocked: fix failing checks first: ' + ', '.join(failed) + '. No model was called.')
                          record('decision.json', state)
                          return
                  files = gh.pages(f"/pulls/{number}/files")
                  if len(files) != pr["changed_files"]:
                      raise ValueError("GitHub omitted changed files; cannot review an incomplete diff")
                  state['review_profile'] = review_profile(files, collaborator(gh, pr['user']))
                  state['paid_rounds'] = spend['paid_rounds']
                  record('review-profile.json', state['review_profile'])
                  record('budget-profile.json', configure_budget(files))
                  # Even missing patches remain listed so both reviewers must fetch sources.
                  declaration = "No mathematical content changed." in (pr.get("body") or "")
                  change_class = classify(files, declaration)
                  known = {ident: {'objection': item['reason'], 'origin': 'App-authenticated earlier review'}
                           for ident, item in historical_obligations(spend['candidates']).items()}
                  known.update({ident: {'objection': item['reason'], **item}
                                for ident, item in unmatched_report_claims(gh, pr, spend['candidates'], {}).items()})
                  if override_command:
                      saved = trusted_reports(app, pr, name, check['id'])
                      for ident in override_findings(saved, pr['head']['sha']):
                          known.setdefault(ident, {'objection': 'Item recorded in the current App check.'})
                  discussion, prior, overrides, _ = history(gh, pr, known)
                  record("context.json", {"head": pr["head"]["sha"], "base": pr["base"]["sha"],
                                         "trusted_workflow": trusted_ref, "class": change_class,
                                         "prior_findings": prior, "overrides": overrides, "discussion": discussion})
                  if override_command:
                      envelopes = trusted_reports(app, pr, name, check['id'])
                      for envelope in envelopes.values():
                          if not same_policy(gh, envelope['policy_ref'], trusted_ref):
                              raise ValueError('Override reports used a different review policy')
                          if effective_head(envelope) != pr['head']['sha'] and not reusable_on_rebase(gh, pr, files, envelope):
                              raise ValueError('Override reports lack a valid current rebase binding')
                      reconcile_obligations(gh, pr, envelopes, spend['candidates'])
                      override_findings(envelopes, pr['head']['sha'])
                      limits = qualified_access_findings(envelopes, include_overridden=True)
                      state['source_access_limitations'] = limits
                      applied = overridden_decision(envelopes, overrides, pr['head']['sha'])
                      conclusion = 'success'
                      summary = 'Accepted by collaborator override, not by unanimous model acceptance. Affected claims are NOT outside reviewed.\n' + json.dumps(applied, indent=2)
                      if limits:
                          summary += '\nNonblocking source-access limitations:\n' + json.dumps(limits, indent=2)
                      state['overrides'] = applied
                      state['scope_overrides'] = [item for e in envelopes.values()
                                                  if (item := review_scope_item(e)) and item['id'] in applied]
                      if state['scope_overrides']:
                          summary += '\nAccepted by admin with incomplete reviewer scope. This is not completed model review:\n' + json.dumps(state['scope_overrides'], indent=2)
                      gh.call(f'/issues/{number}/comments', 'POST', {'body': summary + findings_summary(envelopes)})
                  elif change_class == "editorial" and not prior:
                      conclusion, summary = "success", "Editorial change under the path/diff rule; author declared no mathematical change. No model review."
                  else:
                      envelopes = reusable_reports(gh, pr, files, spend['candidates'], explicit_review=review_command, overrides=overrides, policy=trusted_ref)
                      record('review-reuse.json', {f: {'original_head': e['head'], 'effective_head': pr['head']['sha'],
                              'check': e['reuse_check'], 'run': e['run'], 'attempt': e['attempt']} for f, e in envelopes.items()})
                      supplements = {}
                      reconcile_obligations(gh, pr, envelopes, spend['candidates'])
                      outstanding = unaddressed_findings(envelopes, prior) or any(e.get('carried_findings') for e in envelopes.values())
                      if set(envelopes) == set(MODELS) and (uncovered_history(envelopes, discussion) or outstanding):
                          # Keep the proof acceptance. Both families disposition a newly
                          # itemized objection; one can cover other new discussion.
                          selected = sorted(envelopes) if outstanding else [sorted(envelopes)[0]]
                          for family in selected:
                              supplements[family] = envelopes.pop(family)
                      missing = set(MODELS) - set(envelopes)
                      if (missing and not review_command and state['review_profile']['name'] == 'light'
                              and spend['paid_rounds'] >= 1):
                          state.update(conclusion='action_required', summary=
                                       'This PR had its one automatic review. To have changes reviewed, ask a maintainer to post /protocol-b review. The one paid round allowance includes an explicitly requested first round; only an admin may override a recorded item. No model was called.')
                          record('decision.json', state)
                          return
                      if missing and not review_command and spend['automatic_rounds'] >= 4:
                          state.update(conclusion='action_required', summary=
                                       'Four automatic review rounds have run. A collaborator must comment /protocol-b review. No model was called.')
                          record('decision.json', state)
                          return
                      for family in missing:
                          key = 'OPENAI_API_KEY' if family == 'astra' else 'ANTHROPIC_API_KEY'
                          if not os.environ.get(key):
                              raise ValueError("Missing protocol-b environment secret " + key)
                      # Save the paid-round intent to the App and a discoverable PR
                      # pointer before either worker starts. Interrupted rounds count.
                      state['automatic_rounds'] += int(automatic and bool(missing))
                      state['paid_rounds'] += int(bool(missing))
                      state['review_round'] = {'number': number, 'run': os.environ['GITHUB_RUN_ID'],
                                               'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'started': bool(missing),
                                               'trigger': 'automatic' if automatic else 'command'}
                      record('decision.json', state)
                      app.call(f"/check-runs/{check['id']}", 'PATCH', {'output': {
                          'title': 'Review not yet accepted', 'summary': f"Review running. Automatic rounds: {state['automatic_rounds']}/4.",
                          'text': json.dumps({'schema': 'protocol-b-decisions/v1', 'head': state['head'],
                                              'reports': {}, 'review_round': state['review_round'],
                                              'automatic_rounds': state['automatic_rounds']})}})
                      gh.call(f'/issues/{number}/comments', 'POST', {'body': ROUND_MARKER + '\n```json\n' +
                              json.dumps({'check': check['id']}) + '\n```'})
                      reviews, failures = {f: e['review'] for f, e in envelopes.items()}, {}
                      with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                          reviewers = {family: Review(gh, pr, files, discussion, prior, overrides, instructions, family, change_class)
                                       for family in missing}
                          for family, previous in supplements.items():
                              reviewers[family].input['retained_acceptance'] = previous
                              reviewers[family].input['review_task'] = ('The unchanged proof retains its earlier review. Assess only the new discussion, outstanding App-recorded findings and interrupted observations not covered by the retained reports, and any source passages needed to decide them. Preserve and disposition all findings. Do not repeat the unchanged proof audit.')
                          futures = {pool.submit(reviewer.run): family for family, reviewer in reviewers.items()}
                          for future in concurrent.futures.as_completed(futures):
                              family = futures[future]
                              try:
                                  value = future.result()
                                  envelope = {"reviewer": family, "model": MODELS[family], "head": pr["head"]["sha"],
                                              "base": pr["base"]["sha"], "run": os.environ["GITHUB_RUN_ID"],
                                              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "review": value,
                                              "read_prerequisites_complete": bool(reviewers[family].history_read and reviewers[family].reads),
                                              "finished_early": reviewers[family].finish_now,
                                              "initial_packet": reviewers[family].initial_packet,
                                              "complete": True, "policy_ref": os.environ['GITHUB_SHA'],
                                              "history_digest": passage_digest(sorted(history_coverage(discussion))) if reviewers[family].history_read else None,
                                              "reuse_binding": None}
                                  if family in supplements:
                                      inherit_report_publications(envelope, supplements[family])
                                  envelopes[family] = envelope
                                  record(family + "-report.json", envelope)
                                  state['reports'] = envelopes
                                  record('decision.json', state)
                                  if family in supplements:
                                      # Supplement identity is mandatory, independent of optional caching.
                                      envelope["supplements_review"] = {k: supplements[family][k] for k in
                                                                        ('head', 'run', 'attempt', 'policy_ref', 'reuse_check')}
                                      envelope['retained_source_evidence'] = retained_sources(supplements[family], value)
                                  try:
                                      envelope["reuse_binding"] = optional_reuse_binding(gh, pr, files, reviewers[family])
                                      if family in supplements:
                                          envelope["reuse_binding"] = inherit_reuse_binding(envelope["reuse_binding"], supplements[family])
                                      bounded_report(envelope)
                                  except Exception as error:
                                      envelope['reuse_binding'] = None
                                      envelope['reuse_binding_omitted'] = 'Optional metadata unavailable: '+str(error)
                                      record(family+'-metadata-error.json', {'error': str(error)})
                                  record(family + "-report.json", envelope)
                                  state['reports'] = envelopes
                                  record('decision.json', state)
                                  # Append, never edit away an objection. Each completed
                                  # review is saved even if the other reviewer fails.
                                  deliver_review_report(gh, pr, envelope)
                                  record('decision.json', state)
                                  reviews[family] = value
                              except Exception as error:
                                  failures[family] = str(error)
                                  if envelopes.get(family, {}).get('complete'):
                                      # Retain a completed verdict even if its bookkeeping failed.
                                      problem = envelopes[family]
                                      problem['post_review_error'] = str(error)
                                      reviews[family] = problem['review']
                                  else:
                                      problem = {"reviewer": family, "model": MODELS[family], "head": pr["head"]["sha"],
                                                 "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                                                 "complete": False, "identity_error": reviewers[family].identity_error, "policy_ref": os.environ['GITHUB_SHA'],
                                                 "initial_packet": reviewers[family].initial_packet,
                                                 "review": {"decision": "changes_requested", "report": "Infrastructure failure, not a model verdict: " + str(error),
                                                            "scope_complete": False, "not_reviewed": ["Review interrupted: " + str(error)],
                                                            "findings": [], "prior_findings": []}}
                                  # Install a safe minimum before salvage, persistence or notification.
                                  envelopes[family] = problem
                                  state['reports'] = envelopes
                                  try:
                                      if family in supplements:
                                          inherit_report_publications(problem, supplements[family])
                                      if not problem['complete'] and reviewers[family].pending_payloads():
                                          problem['review']['report'] = 'Delivered final reports did not complete validation; originals retained in the artifact. '+str(error)
                                          problem['review'].update(reviewers[family].pending_obligations())
                                      record(family + ('-report.json' if problem['complete'] else '-failure.json'), problem)
                                      record('decision.json', state)
                                      deliver_review_report(gh, pr, problem)
                                      record('decision.json', state)
                                  except Exception as processing_error:
                                      # Never leave as_completed before collecting the peer's paid verdict.
                                      problem['post_review_error'] = str(processing_error)
                                      failures[family] += '; failure processing: '+str(processing_error)
                      if failures:
                          raise RuntimeError(json.dumps(failures))
                      current_discussion, current_prior, _, _ = history(gh, pr, known)
                      reconcile_obligations(gh, pr, envelopes, spend['candidates'])
                      accepted, limits = bounded_decision(state, envelopes, current_prior, current_discussion)
                      state['source_access_limitations'] = limits
                      if accepted:
                          conclusion = "success"
                          summary = "Both approved reviewers accepted this revision. When either family authored the change, only the other is an outside reviewer. This is informal review, not a formal proof."
                          if any(e['review']['decision'] != 'accept' for e in envelopes.values()):
                              summary = 'Review requirement met with only nonblocking observations. Original reviewer decisions are preserved; this is not unanimous acceptance.'
                          if limits:
                              summary = ("Review requirement met with nonblocking source-access limitations. "
                                         "The named other reviewer verified each unavailable passage; this is not unanimous source inspection.\n"
                                         + json.dumps(limits, ensure_ascii=False, indent=2))
                          if any('reuse_check' in e for e in envelopes.values()):
                              summary += "\nPrior completed reviews reused; see review-reuse.json and original run/check IDs."
                          if overrides:
                              summary += "\nCollaborator overrides apply; affected claims are NOT outside reviewed:\n" + json.dumps(overrides, indent=2)
                      else:
                          summary = "At least one reviewer requests changes. Resolve the recorded findings; a favorable second report cannot override them."
                  current = gh.call(f"/pulls/{number}")
                  latest_ref = gh.call('/commits/' + default)['sha']
                  if current['head']['sha'] != pr['head']['sha'] or not same_policy(gh, state['policy_ref'], latest_ref):
                      raise ValueError('PR head or trusted review policy changed during review; this run cannot approve')
              except Exception as error:
                  conclusion, summary = "failure", str(error)
                  record("failure.json", {"message": str(error)})
                  log("Review failed: " + str(error))
              summary += findings_summary(envelopes)
              state.update(conclusion=conclusion, summary=summary, reports=envelopes)
              record('decision.json', state)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary + "\n")
              if conclusion != "success":
                  raise RuntimeError("Protocol B review is blocked")


          def head_checks(gh, head):
              """Read every current check, shared by spending and merge guards."""
              checks, seen, total = [], set(), None
              for page in range(1, 101):
                  value = gh.call(f"/commits/{head}/check-runs?filter=latest&per_page=100&page={page}")
                  if total is not None and value['total_count'] != total:
                      raise ValueError('Check list changed during pagination; no merge requested')
                  total = value['total_count']
                  rows = value['check_runs']
                  for check in rows:
                      if check['id'] in seen or check['head_sha'] != head:
                          raise ValueError('Duplicate or wrong-head check; no merge requested')
                      seen.add(check['id'])
                      checks.append(check)
                  if len(checks) == total:
                      break
                  if not rows or len(checks) > total:
                      raise ValueError('Incomplete check list; no merge requested')
              else:
                  raise ValueError('Check pagination limit reached; no merge requested')
              return checks


          def required_checks_passed(gh, head, requirements):
              """Conservative readiness check; GitHub still enforces rules on merge."""
              checks = head_checks(gh, head)
              # A legacy status with the same name also has to pass. Statuses lack
              # an App identity here, so they cannot satisfy an App-pinned rule.
              statuses = {}
              for status in gh.pages(f"/commits/{head}/statuses"):
                  context = status['context'].casefold()
                  prior = statuses.get(context)
                  if prior is None or status['id'] > prior['id']:
                      statuses[context] = status
              for rule in requirements:
                  name, integration = rule['context'], rule.get('integration_id')
                  pinned = integration not in (None, -1)
                  matches = [c for c in checks if c['name'] == name and
                             (c.get('app') or {}).get('id') is not None and
                             (not pinned or (c.get('app') or {}).get('id') == integration)]
                  status = statuses.get(name.casefold())
                  if status is not None and status['state'] != 'success':
                      return False
                  if not matches and (pinned or status is None):
                      return False
                  if any(c['status'] != 'completed' or c['conclusion'] != 'success' for c in matches):
                      return False
              return bool(requirements)


          def merge_readiness(gh, state, record_name='merge-readiness.json'):
              # Preserve the protected route for both immediate and deferred merges.
              rules = gh.pages("/rules/branches/" + urllib.parse.quote(state['default'], safe=""))
              required = {c["context"] for rule in rules if rule["type"] == "required_status_checks"
                          for c in rule["parameters"]["required_status_checks"]}
              if not ({CHECK} | REQUIRED_COMPUTATIONS) <= required:
                  raise RuntimeError("Auto-merge withheld: the reviewer check or computation protections are not required")
              if not any(c['context'] == CHECK and c.get('integration_id') == int(os.environ['APP_ID'])
                         for rule in rules if rule['type'] == 'required_status_checks'
                         for c in rule['parameters']['required_status_checks']):
                  raise RuntimeError('Auto-merge withheld: required review check is not pinned to the dedicated App')
              if not any(rule["type"] == "required_status_checks" and rule["parameters"].get("strict_required_status_checks_policy") for rule in rules):
                  raise RuntimeError("Auto-merge withheld: require an up-to-date branch so changed base dependencies cannot bypass review")
              if not gh.call('').get("allow_auto_merge"):
                  raise RuntimeError("Review passed, but repository auto-merge is disabled; complete the owner-approved activation checklist")
              requirements = [c for rule in rules if rule['type'] == 'required_status_checks'
                              for c in rule['parameters']['required_status_checks']]
              ready = required_checks_passed(gh, state['head'], requirements)
              record(record_name, {'head': state['head'], 'requirements': requirements,
                                             'all_required_checks_passed': ready})
              current = gh.call(f"/pulls/{state['number']}")
              if current["head"]["sha"] != state['head']:
                  raise RuntimeError("Head changed before requesting merge")
              if current['base']['ref'] != state['default'] or current['state'] != 'open' or current['draft']:
                  raise RuntimeError('PR is no longer open and ready for the protected default branch')
              latest_ref = gh.call('/commits/' + state['default'])['sha']
              if not same_policy(gh, state['policy_ref'], latest_ref):
                  raise RuntimeError('Review policy changed before requesting merge')
              return ready, current, latest_ref


          def direct_merge(gh, state, latest_ref):
              comparison = gh.call(f"/compare/{latest_ref}...{state['head']}")
              behind = comparison.get('behind_by')
              record('merge-base-check.json', {'default_tip': latest_ref, 'head': state['head'], 'behind_by': behind})
              if type(behind) is not int or behind != 0:
                  raise RuntimeError('Direct merge withheld: reviewed head must contain the current default-branch tip')
              # Deployment requires an empty ruleset bypass list; the SHA is atomic.
              result = gh.call(f"/pulls/{state['number']}/merge", 'PUT', {'sha': state['head'], 'merge_method': 'merge'})
              record('merge-result.json', result)
              if result.get('merged') is not True:
                  raise RuntimeError('Direct merge was not confirmed: ' + json.dumps(result))
              return result['sha']


          def confirm_and_dispatch(gh, state, expected_merge):
              """Confirm a direct merge once, then dispatch both existing main workflows."""
              pr = gh.call(f"/pulls/{state['number']}")
              if pr['head']['sha'] != state['head'] or pr['base']['ref'] != 'main' or state['default'] != 'main':
                  raise RuntimeError('PR head or destination changed before merge confirmation')
              merge = pr.get('merge_commit_sha')
              if (pr.get('merged') is not True or pr['state'] != 'closed' or
                      not isinstance(merge, str) or not re.fullmatch(r'[0-9a-f]{40}', merge)):
                  raise RuntimeError('Direct merge is not confirmed; no checks dispatched')
              if merge != expected_merge:
                  raise RuntimeError('Confirmed merge differs from the merge response')
              tip = gh.call('/commits/main')['sha']
              comparison = gh.call(f"/compare/{merge}...{tip}")
              if type(comparison.get('behind_by')) is not int or comparison['behind_by'] != 0:
                  raise RuntimeError('Merged commit is not contained in main')
              record('merge-confirmation.json', {'number': state['number'], 'head': state['head'],
                     'base': 'main', 'merge_commit_sha': merge, 'default_tip': tip,
                     'merged_by': pr.get('merged_by'), 'merged_at': pr.get('merged_at')})
              failures = []
              for workflow in ('research-checks.yml', 'kernel-lean.yml'):
                  receipt = {'workflow': workflow, 'request': {'ref': 'main'}, 'status': 'intent',
                             'merge_commit_sha': merge}
                  name = 'dispatch-' + workflow + '.json'
                  record(name, receipt)
                  try:
                      # Never retry a write: a timeout can mean GitHub accepted it.
                      result = gh.dispatch_workflow(workflow, 'main')
                      receipt.update(status='accepted', response=result)
                      record(name, receipt)
                      run_id = (result or {}).get('workflow_run_id')
                      if type(run_id) is not int or run_id <= 0:
                          raise RuntimeError('Dispatch did not return a run ID; reconcile Actions before retrying')
                      run = gh.call(f'/actions/runs/{run_id}')
                      receipt['run'] = {k: run.get(k) for k in ('id', 'head_sha', 'head_branch', 'event', 'path', 'html_url', 'status')}
                      sha = run.get('head_sha')
                      if (run.get('id') != run_id or run.get('event') != 'workflow_dispatch' or
                              run.get('head_branch') != 'main' or
                              run.get('path') not in ('.github/workflows/' + workflow, '.github/workflows/' + workflow + '@main') or
                              not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha)):
                          raise RuntimeError('Unexpected dispatched run identity; reconcile Actions before retrying')
                      receipt.update(status='run_confirmed', head_sha=sha, head_differs_from_merge=(sha != merge))
                      record(name, receipt)
                  except Exception as error:
                      receipt['error'] = str(error)
                      record(name, receipt)
                      failures.append(workflow + ': ' + str(error))
              if failures:
                  raise RuntimeError('Post-merge dispatch needs reconciliation: ' + '; '.join(failures))
              log('Confirmed direct merge ' + merge + '; dispatched both workflows on main. See receipts for their actual head SHAs.')
              return merge


          def merge_and_dispatch(gh, state):
              ready, current, latest_ref = merge_readiness(gh, state)
              expected_merge = None
              if ready:
                  expected_merge = direct_merge(gh, state, latest_ref)
              elif not current.get('auto_merge'):
                  # Only an explicit refusal permits the one readiness recheck. Transport
                  # failures and ambiguous partial GraphQL success are never replayed.
                  refusal = None
                  try:
                      result = gh.api('/graphql', 'POST', {'query': 'mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{id}}}', 'variables': {'id': current['node_id']}})
                      record('auto-merge-result.json', result)
                      if result.get('errors'):
                          # A null mutation result is not proof of no side effects.
                          # Accept only the known explicit state refusals, never
                          # generic/internal execution errors or mixed errors.
                          errors = result['errors']
                          if ((result.get('data') or {}).get('enablePullRequestAutoMerge') or
                                  not isinstance(errors, list) or not all(
                                      isinstance(e, dict) and e.get('type') == 'UNPROCESSABLE' and
                                      isinstance(e.get('message'), str) and re.fullmatch(
                                          r'Pull request (?:Pull request )?is in (?:clean|unstable) status', e['message'])
                                      for e in errors)):
                              raise RuntimeError('Ambiguous or unrecognized auto-merge error; reconcile before retrying')
                          refusal = errors
                  except RequestError as error:
                      # HTTP status alone does not identify a state refusal.
                      raise
                  if refusal is not None:
                      record('auto-merge-refusal.json', {'error': refusal})
                      ready, current, latest_ref = merge_readiness(gh, state, 'merge-readiness-after-refusal.json')
                      if not ready:
                          raise RuntimeError('Auto-merge refused and required checks are not ready after the one recheck: ' + json.dumps(refusal))
                      expected_merge = direct_merge(gh, state, latest_ref)
              if expected_merge is None:
                  record('post-merge-manual.json', {'number': state['number'], 'head': state['head'],
                         'reason': 'Deferred auto-merge: maintainer must dispatch both workflows on main after confirming merge.'})
                  log('Deferred auto-merge. After merge, a maintainer must start Research checks and Kernel Lean build on main. No polling.')
                  return
              return confirm_and_dispatch(gh, state, expected_merge)


          def round_summary_body(state, repo, check_url):
              """Readable navigation; original reports and App decisions remain intact."""
              reports = state.get('reports', {})
              carried = {ident for e in reports.values() for ident in e.get('carried_findings', {})}
              relieved = {(item['finding'], item['reviewer_unable_to_open']): item
                          for item in state.get('source_access_limitations', []) if item['finding'] not in carried}
              overridden = state.get('overrides', {})
              blocking, nonblocking = {}, {}
              decisions = {}
              for family, envelope in reports.items():
                  review = envelope.get('review', {})
                  decisions[family] = review.get('decision', 'incomplete') if envelope.get('complete') and review.get('scope_complete', True) else 'incomplete'
                  scope = review_scope_item(envelope)
                  if scope:
                      detail = scope['objection']+' Unreviewed: '+'; '.join(scope['not_reviewed'])
                      if scope['id'] in overridden:
                          nonblocking[scope['id']] = 'Admin accepted incomplete review scope. '+detail
                      else:
                          blocking[scope['id']] = 'Incomplete review scope, not a mathematical error. '+detail
                  omitted = envelope.get('nonblocking_notes_omitted', {})
                  if omitted.get('count', 0):
                      nonblocking[family+'-retained-notes'] = str(omitted['count'])+" editorial notes remain in this reviewer's original linked report."
                  entries = [(finding_id(envelope, item['id']), item.get('location', ''),
                              item.get('objection', ''), 'unresolved') for item in blocking_findings(review)]
                  for item in review.get('findings', []):
                      if item.get('severity') == 'note':
                          nonblocking[finding_id(envelope, item['id'])] = item.get('location', '') + ': ' + item.get('objection', '')
                  entries += [(ident, '', 'Retained from an earlier App review: '+item['reason'], 'unresolved')
                              for ident, item in envelope.get('carried_findings', {}).items()]
                  entries += [(item['id'], '', item.get('reason', ''), item['resolution'])
                              for item in review.get('prior_findings', []) if item['resolution'] != 'resolved']
                  for ident, location, detail, resolution in entries:
                      if (ident, family) in relieved:
                          item = relieved[ident, family]
                          description = 'Source access: '+item['reviewer_who_checked']+' verified the named passage; '+item['reviewer_unable_to_open']+' could not open it.'
                          nonblocking[ident] = ' '.join(sorted({description, nonblocking.get(ident, '')})).strip()
                      elif ident in overridden or resolution == 'overridden':
                          nonblocking[ident] = 'Accepted by a recorded admin override. The reviewers did not accept this point.'
                      else:
                          description = (location+': ' if location else '')+detail
                          blocking[ident] = ' '.join(sorted({description, blocking.get(ident, '')})).strip()
              # An unresolved objection in one report still counts if another report
              # individually called it overridden without an applied whole-round override.
              for ident in blocking:
                  nonblocking.pop(ident, None)
              accepted = state['conclusion'] == 'success'
              title = 'Review requirement met' if accepted else 'Review requirement not met'
              rows = [SUMMARY_MARKER, '<!-- check: '+str(state['check'])+' -->',
                      '## '+title, '', 'Head `'+state['head']+'`.', '']
              if decisions:
                  display = {'accept': 'accepted', 'changes_requested': 'requested changes', 'incomplete': 'did not complete'}
                  rows += ['; '.join(name.capitalize()+': '+display.get(decision, decision)
                                    for name, decision in sorted(decisions.items()))+'.', '']
              def section(title, items):
                  rows.extend(['### '+title, ''])
                  if not items:
                      rows.extend(['None.', ''])
                      return
                  for ident, detail in list(sorted(items.items()))[:10]:
                      excerpt = ' '.join(detail.split()).replace('@', '@\u200b')
                      if len(excerpt) > 500:
                          excerpt = excerpt[:497]+'...'
                      rows.append('- `'+ident+'`: '+excerpt)
                  if len(items) > 10:
                      rows.append('- '+str(len(items)-10)+' more entries are retained in the linked App check and original reports.')
                  rows.append('')
              section('Blocking findings', blocking)
              section('Nonblocking observations', nonblocking)
              rows.extend(['### Next step', ''])
              if accepted:
                  rows.append('No review changes are required. Merge remains subject to the repository\'s required checks and current-head rules.')
              elif blocking:
                  rows.append('Address the blocking findings above, or reply on this PR to request an admin decision. The nonblocking observations do not require changes in this PR.')
              else:
                  rows.append('The review has not produced an accepted result. See the check summary for missing prerequisites or an interrupted review; this alone is not a mathematical error.')
              scope_ids = sorted(item['id'] for e in reports.values()
                                 if (item := review_scope_item(e)) and item['id'] in blocking)
              if scope_ids:
                  rows.append('Current incomplete-scope items: '+', '.join('`'+ident+'`' for ident in scope_ids)+'. An admin decision must name these current IDs and this head; an older round has different IDs.')
              rows += ['', '[Full App check and retained review records]('+check_url+').', '']
              runs = sorted({str(e['run']) for e in reports.values() if e.get('run')})
              if runs:
                  rows += ['Original review runs: '+', '.join('[`'+run+'`](https://github.com/'+repo+'/actions/runs/'+run+')' for run in runs)+'.', '']
              metadata = {'schema': 'protocol-b-round-summary/v1', 'head': state['head'],
                          'check': state['check'], 'conclusion': state['conclusion'],
                          'reviewer_decisions': decisions, 'blocking_count': len(blocking),
                          'nonblocking_count': len(nonblocking)}
              rows += ['<details><summary>Summary metadata</summary>', '', '```json',
                       json.dumps(metadata, ensure_ascii=False, indent=2, sort_keys=True), '```', '', '</details>']
              return '\n'.join(rows)


          def post_round_summary(gh, state, check):
              prefix = SUMMARY_MARKER+'\n<!-- check: '+str(state['check'])+' -->'
              for comment in gh.pages(f"/issues/{state['number']}/comments"):
                  if own_comment(gh, comment) and comment['body'].startswith(prefix+'\n'):
                      record('round-summary.json', {'check': state['check'], 'existing_comment': comment['id']})
                      return
              body = round_summary_body(state, gh.repo, check.get('html_url') or
                                        f"https://github.com/{gh.repo}/runs/{state['check']}")
              result = gh.call(f"/issues/{state['number']}/comments", 'POST', {'body': body})
              record('round-summary.json', {'check': state['check'], 'comment': result, 'body': body})


          def review_notes(state):
              notes = []
              for family, envelope in state.get('reports', {}).items():
                  if not envelope.get('complete'):
                      continue
                  for finding in envelope['review']['findings']:
                      if finding.get('severity') == 'note':
                          notes.append({'id': finding_id(envelope, finding['id']), 'reviewer': family,
                                        'location': finding['location'], 'note': finding['objection']})
              return notes


          def publish_notes_backlog(gh, state, check):
              """Append notes to a configured issue, without making delivery a merge gate."""
              notes = review_notes(state)
              if not notes:
                  return
              record('nonblocking-notes.json', {'number': state['number'], 'head': state['head'], 'notes': notes})
              issue = os.environ.get('NOTES_ISSUE', '')
              if not re.fullmatch(r'[1-9][0-9]*', issue):
                  raise ValueError('PROTOCOL_B_NOTES_ISSUE is not configured')
              target = gh.call('/issues/'+issue)
              if target.get('pull_request') or target.get('state') != 'open':
                  raise ValueError('The nonblocking-notes backlog must be an open issue')
              # One marker per original note prevents duplicate collection after review reuse.
              existing = {marker for c in gh.pages('/issues/'+issue+'/comments') if own_comment(gh, c)
                          for marker in re.findall(r'<!-- protocol-b-note:[A-Za-z0-9_-]+ -->', c['body'])}
              header = ('Nonblocking review notes from PR #' + str(state['number']) +
                        ', head `' + state['head'] + '`.\n\n'
                        'For optional maintainer cleanup. They are not conditions of accepting that PR.\n\n'
                        '[Original App check](https://github.com/' + gh.repo + '/runs/' + str(state['check']) + ')\n\n')
              chunks, entries, ids = [], [], []
              def safe_text(value):
                  return value.replace('@', '@\u200b').replace('<', '&lt;')
              # Construct all bounded batches before posting. Usually one comment suffices.
              # Retain per-note markers so reuse can never create a second copy of a note.
              for note in notes:
                  marker = '<!-- protocol-b-note:' + note['id'] + ' -->'
                  if marker in existing:
                      continue
                  entry = marker+'\n### '+safe_text(note['location'])+'\n\n'+safe_text(note['note'])+'\n\n'
                  if len((header+entry).encode()) > 45_000:
                      raise ValueError('A note exceeds the backlog comment limit; original PR report retained')
                  if entries and len((header+''.join(entries)+entry).encode()) > 45_000:
                      chunks.append((header+''.join(entries), ids))
                      entries, ids = [], []
                  entries.append(entry)
                  ids.append(note['id'])
              if entries:
                  chunks.append((header+''.join(entries), ids))
              posted = []
              for body, ids in chunks:
                  result = gh.call('/issues/'+issue+'/comments', 'POST', {'body': body})
                  posted.append({'findings': ids, 'comment': result['id']})
              record('notes-backlog-result.json', {'issue': int(issue), 'posted': posted})


          def publish():
              """Use a fresh official-action token after the potentially long review."""
              path = OUT / 'decision.json'
              if not path.is_file():
                  log('No check was created; nothing to finalize')
                  return
              state = json.loads(path.read_text(encoding='utf-8'))
              gh, app = start_clients()
              current = gh.call(f"/pulls/{state['number']}")
              candidates = list(state.get('prior_candidates', []))
              if state['conclusion'] != 'success':
                  previous = trusted_reports(app, current, state['name'], state['check'])
                  ensure_scope_records(state, previous, candidates)
              reconcile_obligations(gh, current, state['reports'], candidates)
              carried = {ident for e in state['reports'].values() for ident in e.get('carried_findings', {})}
              missing = carried - set(state.get('overrides', {}))
              if missing:
                  state.update(conclusion='failure', summary=state['summary']+'\nUnaddressed earlier objections: '+', '.join(sorted(missing)))
              for envelope in state['reports'].values():
                  reconcile_report_publications(gh, current, envelope)
                  pending = [o for o in envelope.get('retained_report_publications', [])
                             if o['report_publication']['status'] == 'failed']
                  if pending:
                      state.update(conclusion='failure', summary=state['summary']+'\nRetained original proof report publication failed; a delivered supplement alone cannot authorize merge. See retained_report_publications for the original run, hash and artifact.')
                  if envelope.get('report_publication', {}).get('status') == 'failed':
                      deliver_review_report(gh, current, envelope, retry=True)
                  publication = envelope.get('report_publication', {})
                  if publication.get('status') == 'failed':
                      state.update(conclusion='failure', summary=state['summary']+'\nOriginal '+envelope['reviewer']+
                          ' verdict retained, but report publication failed; no merge. See report_publication in the App record and the original run artifact.')
                  if envelope.get('post_review_error') and review_scope_item(envelope)['id'] not in state.get('overrides', {}):
                      state.update(conclusion='failure', summary=state['summary']+'\nIncomplete review metadata: '+envelope['post_review_error'])
              record('scope-items.json', state.get('scope_items', []))
              latest_ref = gh.call('/commits/' + state['default'])['sha']
              check = app.call(f"/check-runs/{state['check']}")
              if check['app']['id'] != int(os.environ['APP_ID']) or check['head_sha'] != state['head'] or check['name'] != state['name']:
                  raise ValueError('Finalization identity mismatch')
              if current['head']['sha'] != state['head'] or not same_policy(gh, state['policy_ref'], latest_ref):
                  state.update(conclusion='failure', summary='Head or review policy changed; no acceptance.')
              # Keep authoritative, compact decisions on the App check. GitHub Actions
              # comments can be forged by another workflow and cannot authorize overrides.
              text = decision_text(state, state['reports'], state.get('source_access_limitations', []))
              compact = json.loads(text)['reports']
              if len(text.encode()) > 60_000 and any(e.get('reuse_binding') for e in compact.values()):
                  record('omitted-rebase-bindings.json', {f: e.get('reuse_binding') for f, e in compact.items()})
                  for e in compact.values():
                      e['reuse_binding'] = None
                      e['reuse_binding_omitted'] = 'App check capacity; rebase reuse disabled.'
                  payload = json.loads(text)
                  payload['reports'] = compact
                  text = json.dumps(payload)
              if state.get('scope_items'):
                  state['summary'] += '\nIncomplete-review items for an admin decision:\n'+json.dumps(state['scope_items'], indent=2)
              record('decision.json', state)
              if state.get('review_profile', {}).get('name') == 'light':
                  state['summary'] += f"\nLight profile: {state.get('paid_rounds', 0)} paid round(s) recorded. After one round, another model call requires a collaborator's explicit review command; item overrides require an admin."
              else:
                  state['summary'] += f"\nAutomatic review rounds: {state.get('automatic_rounds', 0)}/4."
              if len(text.encode()) > 60_000 or len(state['summary'].encode()) > 60_000:
                  raise ValueError('Check output exceeds capacity; remains blocked, never truncate findings')
              app.call(f"/check-runs/{state['check']}", 'PATCH', {'status': 'completed', 'conclusion': state['conclusion'],
                       'output': {'title': state['name'], 'summary': state['summary'], 'text': text}})
              try:
                  post_round_summary(gh, state, check)
              except Exception as error:
                  # An explanatory comment cannot invalidate an accepted check.
                  record('round-summary-error.json', {'message': str(error), 'check': state['check']})
                  log('Round summary could not be posted: '+str(error))
              try:
                  publish_notes_backlog(gh, state, check)
              except Exception as error:
                  record('notes-backlog-error.json', {'message': str(error), 'check': state['check']})
                  log('Nonblocking notes remain in original PR reports; backlog delivery failed: '+str(error))
              if state['conclusion'] != 'success':
                  raise RuntimeError('Protocol B review is blocked')
              if state['mode'] == 'live':
                  merge_and_dispatch(gh, state)
              else:
                  log("Test accepted. Auto-merge is disabled in test mode.")


          if __name__ == "__main__":
              publish() if len(sys.argv) > 1 and sys.argv[1] == 'publish' else main()
          PROTOCOL_B_PYTHON
          python3 "$RUNNER_TEMP/protocol-b.py" review
      - name: Mint fresh token after the review
        if: always() && steps.app_start.outcome == 'success' && steps.review.outcome != 'skipped'
        id: app_finish
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PROTOCOL_B_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_B_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Finalize the App check and request a protected merge
        if: always() && steps.app_finish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app_finish.outputs.token }}
          APP_ID: ${{ vars.PROTOCOL_B_APP_ID }}
          NOTES_ISSUE: ${{ vars.PROTOCOL_B_NOTES_ISSUE }}
        run: python3 "$RUNNER_TEMP/protocol-b.py" publish
      - name: Preserve reports and diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protocol-b-reports/
          if-no-files-found: ignore
          retention-days: 90
