# This workflow is scoped to the isolated PR #48 verification ref.
name: PR 48 Deligne-Serre verification after the CM Serre-Tate fold

on:
  workflow_dispatch:
    inputs:
      resume_from:
        description: Previous run of this exact revision with a FLT checkpoint
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pr48-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Deicyde/diophantine-z-q' && github.ref == 'refs/heads/codex/pr48-verify-da47dac'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out the verification candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8

      - name: Confirm the pinned merge and build inputs
        run: |
          set -euo pipefail
          merge=c9936b7dc6ee83abfcadd6274cc6c80bcd1152f2
          git merge-base --is-ancestor "$merge" HEAD
          base=$(git rev-parse "$merge^1")
          test "$base" = da47dac4524b4ed001cf2468d7da44228f7991a0
          cached_main=c4e2a8c5455789b9feb9afc7bc732ce8e754a5ca
          git merge-base --is-ancestor "$cached_main" "$base"
          git diff --exit-code "$cached_main" "$base" -- '*.lean' '**/lakefile.toml' lakefile.toml \
            '**/lake-manifest.json' lake-manifest.json '**/lean-toolchain' lean-toolchain .gitmodules
          test "$(git rev-parse "$merge^2")" = bc93461db09a054c3ebcba7b88b98d3e08393b1c
          git diff --exit-code "$merge" HEAD -- ZInQKernel ZInQKernel.lean lean ThirdParty CMSerreTateSupport lakefile.toml lake-manifest.json lean-toolchain docs/one-proof
          # Allow reuse of the completed port only when every incoming source path,
          # mode and blob is exactly the one used by the successful predecessor.
          port_delta=$(git diff --raw -z --no-abbrev --no-renames "$base" "$merge" -- ZInQKernel/Contrib | sha256sum)
          test "${port_delta%% *}" = 9c87a54211dc4e02f8e59376f00479d5af70d3b4f5bf6558e9a82ea8b23e3a75
          printf 'Verification source: %s\n' "$merge"

      - name: Require a completed main build with a passing axiom check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44519135860/attempts/2" |
            jq -e '.head_sha == "c4e2a8c5455789b9feb9afc7bc732ce8e754a5ca" and .head_branch == "main"
              and .path == ".github/workflows/main-build-cache.yml" and .run_attempt == 2
              and .status == "completed" and .conclusion == "success"' > /dev/null

      - name: Free disk space and add swap
        run: |
          set -euo pipefail
          df -h / /mnt || true
          free -h
          # Preinstalled software this job does not use. A full build of the OneProof targets is about 41 GB
          # (34 GB for this repository, 7 GB for Mathlib), and the cache archive needs room as well.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/local/julia* /usr/local/share/chromium \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az \
            /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli /opt/pipx
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          # Swap goes on the separate temporary disk when the runner has one. Otherwise it is a swap file on /,
          # sized to leave about 75 GB of / for the toolchain and Mathlib (12 GB), the build (34 GB), a cache
          # archive of up to 10 GB, and a margin. The run of 2026-11-17 used an 82 GB swap file, filled / and
          # stopped without saving.
          if mountpoint -q /mnt; then
            dir=/mnt
            avail="$(df --output=avail -BG /mnt | tail -n 1 | tr -dc '0-9')"
            size=$((avail - 2))
          else
            dir=
            avail="$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')"
            size=$((avail - 75))
            if [ "$size" -lt 8 ]; then size=8; fi
          fi
          if [ "$size" -gt 48 ]; then size=48; fi
          if [ "$size" -ge 1 ]; then
            sudo fallocate -l "${size}G" "$dir/swapfile"
            sudo chmod 600 "$dir/swapfile"
            sudo mkswap "$dir/swapfile"
            sudo swapon "$dir/swapfile"
          fi
          free -h
          df -h / /mnt || true

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # One stalled download held this step for almost six hours (run 44115543349). Each attempt gets ten minutes;
      # a retry downloads every file again, since a stopped download can leave a truncated archive.
      - name: Fetch the Mathlib build cache
        timeout-minutes: 35
        run: |
          timeout -k 30 600 lake exe cache get && exit 0
          for attempt in 2 3; do
            echo "::warning::lake exe cache get did not finish; attempt $attempt downloads every file again."
            timeout -k 30 600 lake exe cache get! && exit 0
          done
          exit 1

      - name: Restore the verified build matching the pinned Lean inputs
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            lean/.lake/build
          key: zinq-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'lean/lakefile.toml') }}-c4e2a8c5455789b9feb9afc7bc732ce8e754a5ca-44519135860-2
          fail-on-cache-miss: true

      - name: Require an exact checkpoint and clear old compiler setup inputs
        env:
          CACHE_HIT: ${{ steps.baseline.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          for root in .lake/build/ir lean/.lake/build/ir; do
            if [[ -d $root ]]; then
              find "$root" -type f -name '*.setup.json' -delete
            fi
          done
          df -h /

      - name: Restore the verified FLT port
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          set -euo pipefail
          if [[ -n $RESUME_FROM ]]; then
            [[ $RESUME_FROM =~ ^[0-9]+$ ]]
            src_run=$RESUME_FROM
            src_sha=$GITHUB_SHA
            src_ref=$GITHUB_REF_NAME
            required_conclusion=
          else
            src_run=44445426874
            src_sha=3030a4b062cc8a273f283c872350d6340e5b8113
            src_ref=codex/pr48-verify-9664901
            required_conclusion=success
          fi
          record=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$src_run")
          jq -e --arg sha "$src_sha" --arg branch "$src_ref" --arg result "$required_conclusion" \
            '.head_sha == $sha and .head_branch == $branch and .path == ".github/workflows/main-build-cache.yml" and .status == "completed" and ($result == "" or .conclusion == $result)' \
            <<< "$record" > /dev/null
          restore_dir=$(mktemp -d "$RUNNER_TEMP/pr48-restore.XXXXXX")
          if [[ -n $RESUME_FROM ]]; then
            gh run download "$src_run" -n pr48-flt-checkpoint -D "$restore_dir"
            bash scratch/pr48-validation/checkpoint.sh restore "$restore_dir"
          else
            # Pin the upload from the successful run. Check the ZIP digest as well
            # as the checkpoint's recorded revision and its internal tar digest.
            artifact_id=14502364005
            digest=1fd4e277db8aa55eb978d29b45da95ac89af6e2ef46e483353fd382242fc30ad
            route="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            gh api "$route" | jq -e --arg repo "$GITHUB_REPOSITORY_ID" \
              --arg sha "$src_sha" --arg digest "sha256:$digest" '
              .id == 14502364005 and .name == "pr48-flt-checkpoint" and .expired == false and .digest == $digest and
              .workflow_run.id == 44445426874 and .workflow_run.head_sha == $sha and
              (.workflow_run.repository_id|tostring) == $repo and (.workflow_run.head_repository_id|tostring) == $repo
              ' >/dev/null
            gh api "$route/zip" > "$restore_dir/checkpoint.zip"
            printf '%s  %s\n' "$digest" "$restore_dir/checkpoint.zip" | sha256sum --check --strict
            unzip -q "$restore_dir/checkpoint.zip" flt.tar.zst source.txt SHA256SUMS -d "$restore_dir"
            rm -f "$restore_dir/checkpoint.zip"
            test "$(cat "$restore_dir/source.txt")" = "$src_sha"
            (cd "$restore_dir" && sha256sum --check --strict SHA256SUMS)
            zstd -dc -- "$restore_dir/flt.tar.zst" | tar --extract --no-same-owner --no-same-permissions -f -
          fi
          rm -f "$restore_dir/flt.tar.zst"

      - name: Verify the witness and the fold
        id: verify
        continue-on-error: true
        timeout-minutes: 265
        env:
          LEAN_NUM_THREADS: 2
        run: |
          set -euo pipefail
          uptime
          free -h
          awk '{exit ($1 > 40)}' /proc/loadavg
          free -m | awk '/^Swap:/ {exit ($3 > 8192)}'
          mkdir -p "$RUNNER_TEMP/pr48-evidence"
          deadline=$(($(date +%s) + 260 * 60))
          setsid bash scratch/pr48-validation/verify.sh "$RUNNER_TEMP/pr48-evidence" &
          pid=$!
          printf 'Verification process group: %s\n' "$pid"
          while kill -0 "$pid" 2>/dev/null; do
            available=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
            if [[ $available -lt 15 || $(date +%s) -ge $deadline ]]; then
              echo "Stopping verification at the disk/time limit; $available GiB remain."
              kill -TERM -- "-$pid" 2>/dev/null || true
              for attempt in $(seq 30); do
                if ! kill -0 -- "-$pid" 2>/dev/null; then break; fi
                sleep 1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              break
            fi
            sleep 20
          done
          status=0
          wait "$pid" || status=$?
          free -h
          df -h /
          du -sh .lake/build
          exit "$status"

      - name: Preserve verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr48-verification
          path: ${{ runner.temp }}/pr48-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack the FLT artifacts from this candidate
        if: ${{ !cancelled() && steps.verify.outcome != 'skipped' && steps.verify.outcome != '' }}
        continue-on-error: true
        timeout-minutes: 15
        run: bash scratch/pr48-validation/checkpoint.sh pack "$RUNNER_TEMP/pr48-checkpoint"

      - name: Keep the FLT checkpoint for a follow-up run
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr48-flt-checkpoint
          path: |
            ${{ runner.temp }}/pr48-checkpoint/flt.tar.zst
            ${{ runner.temp }}/pr48-checkpoint/source.txt
            ${{ runner.temp }}/pr48-checkpoint/SHA256SUMS
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 4

      - name: Require Lean verification to pass
        if: ${{ !cancelled() && steps.verify.outcome != 'success' }}
        run: |
          echo "::error::The PR #48 proof and fold did not both verify. See the job log and verification artifact."
          exit 1
