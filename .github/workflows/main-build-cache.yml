# This workflow is scoped to the isolated PR #48 verification ref.
name: PR 48 Deligne-Serre exact main and fold verification

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: pr48-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Deicyde/diophantine-z-q' && github.ref == 'refs/heads/codex/pr48-fold-ff165f7'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the verification candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10

      - name: Confirm the pinned merge and build inputs
        run: |
          set -euo pipefail
          tip=ff165f7c9b1d96b8cee4af3ea069e966abc2fac5
          checkpoint=56bd646d81b47b1cf7256fca1cd865fe0f4d000b
          merge=0b1e1b711059bb15bbbac2ead386c3f49564a30b
          trimmed=71751648d10556a1aadaccb36eadeb11b5114880
          git merge-base --is-ancestor "$checkpoint" "$tip"
          git merge-base --is-ancestor "$trimmed" HEAD
          test "$(git diff --name-only "$checkpoint" "$tip")" = docs/one-proof/claims.tsv
          test "$(git rev-parse "$trimmed^")" = "$merge"
          test "$(git rev-parse "$merge^1")" = "$tip"
          test "$(git rev-parse "$merge^2")" = bc93461db09a054c3ebcba7b88b98d3e08393b1c
          git diff --exit-code "$trimmed" HEAD -- . ':(exclude).github/workflows/main-build-cache.yml' ':(exclude)scratch/pr48-validation/**'
          port_delta=$(git diff --raw -z --no-abbrev --no-renames "$tip" "$trimmed" -- ZInQKernel/Contrib | sha256sum)
          test "${port_delta%% *}" = d8c4395fc26a557f7e2b08ebe33510b34b2d016733123f082840b0f15b5aabe2
          echo "Main $tip, trimmed input $trimmed"

      - name: Free disk space and add swap
        run: |
          set -euo pipefail
          df -h / /mnt || true
          free -h
          # Preinstalled software this job does not use. A full build of the OneProof targets is about 41 GB
          # (34 GB for this repository, 7 GB for Mathlib), and the cache archive needs room as well.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/local/julia* /usr/local/share/chromium \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az \
            /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli /opt/pipx
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          # The last main run reached the disk threshold with 53 GiB in .lake/build
          # and zero swap use. Allow more room for the FLT cache and kernel checks.
          if mountpoint -q /mnt; then
            dir=/mnt
            avail="$(df --output=avail -BG /mnt | tail -n 1 | tr -dc '0-9')"
            size=$((avail > 34 ? 32 : avail - 2))
          else
            dir=/
            size=20
          fi
          if [ "$size" -ge 1 ]; then
            sudo fallocate -l "${size}G" "$dir/swapfile"
            sudo chmod 600 "$dir/swapfile"
            sudo mkswap "$dir/swapfile"
            sudo swapon "$dir/swapfile"
          fi
          free -h
          df -h / /mnt || true

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # One stalled download held this step for almost six hours (run 44115543349). Each attempt gets ten minutes;
      # a retry downloads every file again, since a stopped download can leave a truncated archive.
      - name: Fetch the Mathlib build cache
        timeout-minutes: 35
        run: |
          timeout -k 30 600 lake exe cache get && exit 0
          for attempt in 2 3; do
            echo "::warning::lake exe cache get did not finish; attempt $attempt downloads every file again."
            timeout -k 30 600 lake exe cache get! && exit 0
          done
          exit 1

      - name: Confirm the pinned main checkpoint source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44610673394/attempts/1" | jq -e '
            .head_sha == "56bd646d81b47b1cf7256fca1cd865fe0f4d000b" and .head_branch == "main" and
            .path == ".github/workflows/main-build-cache.yml" and .status == "completed"
            ' > /dev/null

      - name: Restore the unfinished checkpoint as build input
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lake/build
            lean/.lake/build
          key: zinq-build-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'lean/lakefile.toml') }}-56bd646d81b47b1cf7256fca1cd865fe0f4d000b-44610673394-1
          fail-on-cache-miss: true

      - name: Require an exact checkpoint and clear old compiler setup inputs
        env:
          CACHE_HIT: ${{ steps.baseline.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          for root in .lake/build/ir lean/.lake/build/ir; do
            if [[ -d $root ]]; then
              find "$root" -type f -name '*.setup.json' -delete
            fi
          done
          df -h /

      - name: Complete and check the pre-fold main build
        timeout-minutes: 35
        env:
          LEAN_NUM_THREADS: 2
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr48-evidence"
          mkdir -p "$out"
          df -h /
          free -h
          timeout -k 30 1800 lake --fail-fast build +ZInQKernel.OneProof.Main +ZInQKernel.OneProof.Discharges > "$out/baseline-build.log" 2>&1 || {
            tail -n 60 "$out/baseline-build.log"
            exit 1
          }
          printf '%s\n' 'import ZInQKernel.OneProof.Main' '#print axioms ZInQ.OneProof.frozenTarget' > "$out/Baseline.lean"
          lake env lean "$out/Baseline.lean" | tee "$out/baseline-axioms.txt"
          python3 -I scripts/one_proof/check_axioms.py "$out/baseline-axioms.txt"
          git diff --exit-code -- ZInQKernel docs/one-proof

      - name: Restore the verified FLT port
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src_sha=04319c41c5f3f81968fc61a462e3b7ff99c6c561
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44567251984" | jq -e --arg sha "$src_sha" '
            .head_sha == $sha and .head_branch == "codex/pr48-verify-3078ae6" and
            .path == ".github/workflows/main-build-cache.yml" and .status == "completed" and .conclusion == "success"
            ' > /dev/null
          restore_dir=$(mktemp -d "$RUNNER_TEMP/pr48-restore.XXXXXX")
          # Pin the upload from the successful run. Check the ZIP digest as well
          # as the checkpoint's recorded revision and its internal tar digest.
          artifact_id=14552733252
          digest=64d2765d4f86c5b9365005809025077711fd41673f5e7a2081108bfa5eba3674
          route="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          gh api "$route" | jq -e --arg repo "$GITHUB_REPOSITORY_ID" \
            --arg sha "$src_sha" --arg digest "sha256:$digest" '
            .id == 14552733252 and .name == "pr48-flt-checkpoint" and .expired == false and .digest == $digest and
            .workflow_run.id == 44567251984 and .workflow_run.head_sha == $sha and
            (.workflow_run.repository_id|tostring) == $repo and (.workflow_run.head_repository_id|tostring) == $repo
            ' >/dev/null
          gh api "$route/zip" > "$restore_dir/checkpoint.zip"
          printf '%s  %s\n' "$digest" "$restore_dir/checkpoint.zip" | sha256sum --check --strict
          unzip -q "$restore_dir/checkpoint.zip" flt.tar.zst source.txt SHA256SUMS -d "$restore_dir"
          rm -f "$restore_dir/checkpoint.zip"
          test "$(cat "$restore_dir/source.txt")" = "$src_sha"
          (cd "$restore_dir" && sha256sum --check --strict SHA256SUMS)
          zstd -dc -- "$restore_dir/flt.tar.zst" | tar --extract --no-same-owner --no-same-permissions -f -
          rm -f "$restore_dir/flt.tar.zst"

      - name: Clear artifacts for removed sources and their downstream users
        run: python3 -IB scratch/pr48-validation/invalidate_trim.py

      - name: Verify the witness and the fold
        id: verify
        continue-on-error: true
        timeout-minutes: 50
        env:
          LEAN_NUM_THREADS: 2
        run: |
          set -euo pipefail
          uptime
          free -h
          awk '{exit ($1 > 40)}' /proc/loadavg
          free -m | awk '/^Swap:/ {exit ($3 > 8192)}'
          mkdir -p "$RUNNER_TEMP/pr48-evidence"
          deadline=$(($(date +%s) + 45 * 60))
          setsid bash scratch/pr48-validation/verify.sh "$RUNNER_TEMP/pr48-evidence" &
          pid=$!
          printf 'Verification process group: %s\n' "$pid"
          while kill -0 "$pid" 2>/dev/null; do
            available=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
            if [[ $available -lt 12 || $(date +%s) -ge $deadline ]]; then
              echo "Stopping verification at the disk/time limit; $available GiB remain."
              kill -TERM -- "-$pid" 2>/dev/null || true
              for attempt in $(seq 30); do
                if ! kill -0 -- "-$pid" 2>/dev/null; then break; fi
                sleep 1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              break
            fi
            sleep 20
          done
          status=0
          wait "$pid" || status=$?
          free -h
          df -h /
          du -sh .lake/build
          exit "$status"

      - name: Preserve verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr48-verification
          path: ${{ runner.temp }}/pr48-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Require Lean verification to pass
        if: ${{ !cancelled() && steps.verify.outcome != 'success' }}
        run: |
          echo "::error::The PR #48 proof and fold did not both verify. See the job log and verification artifact."
          exit 1
