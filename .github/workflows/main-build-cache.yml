# Dispatch only on the isolated height proof verification branch (fold first).
name: Verify five height discharges

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: height-discharge-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Deicyde/diophantine-z-q' && github.ref == 'refs/heads/codex/verify-height-discharges-26-b'
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      BASE: 2792b59cf602398df77fb012a408cc7f0c0689e2
      TESTED_HEAD: dd231702b5e549c3fdafae68a53c5ae18cf65ba1
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Check the candidate and cache inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE" "$TESTED_HEAD"
          git merge-base --is-ancestor "$TESTED_HEAD" HEAD
          git diff --exit-code "$TESTED_HEAD" HEAD -- . ':(exclude).github/workflows/main-build-cache.yml'
          git diff --exit-code ffdbe5c09d431bd8d444c8620cf400a29b1e66c1 "$BASE" -- \
            lakefile.toml lean/lakefile.toml lake-manifest.json lean/lake-manifest.json lean-toolchain
          git diff --exit-code "$BASE" HEAD -- ZInQKernel lean \
            ':(exclude)ZInQKernel/OneProof/Main.lean' ':(exclude)ZInQKernel/OneProof/H/TailZ99.lean'
          git diff --check "$BASE" HEAD
          git rev-parse "$TESTED_HEAD"
          python3 -IB scripts/check_target.py
          python3 -IB scripts/one_proof/render_open.py --check

      - name: Leave room for the cached objects and the incremental build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/local/julia* /usr/local/share/chromium \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az \
            /usr/local/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli /opt/pipx
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          if mountpoint -q /mnt && [[ $(df --output=avail -BG /mnt | tail -n 1 | tr -dc '0-9') -ge 18 ]]; then
            swapfile=/mnt/height-swapfile
            swap_size=16
          else
            swapfile=/height-swapfile
            swap_size=8
          fi
          sudo fallocate -l "$((swap_size * 1024 * 1024 * 1024))" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          df -h / /mnt
          free -h

      - name: Install the pinned Lean toolchain via elan
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" \
            | sha256sum --check --strict
          tar -xf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        timeout-minutes: 33
        run: |
          set -euo pipefail
          timeout -k 30 600 lake exe cache get && exit 0
          for attempt in 2 3; do
            timeout -k 30 600 lake exe cache get! && exit 0
          done
          exit 1

      - name: Restore the known main checkpoint
        id: checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/build
            lean/.lake/build
          key: zinq-build-v1-Linux-22ffff8e3aa185cb45e0de0fa21b600792e92102555dd3dda8b190d9eb9c3c53-dfc6804f30bb08ec33abefeca76cba33405b8984-44690898399-1
          fail-on-cache-miss: true

      - name: Build the headline with the five proofs
        id: fold
        timeout-minutes: 172
        env:
          CACHE_HIT: ${{ steps.checkpoint.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          out="$RUNNER_TEMP/height-evidence"
          mkdir -p "$out"
          df -h /
          if ! timeout -k 30 9900 lake --fail-fast build +ZInQKernel.OneProof.Main +ZInQKernel.OneProof.Discharges > "$out/fold-build.log" 2>&1; then
            tail -n 90 "$out/fold-build.log"
            df -h /
            exit 1
          fi
          tail -n 15 "$out/fold-build.log"
          lake env lean scratch/one-proof/DumpCompact.lean | tee "$out/final.txt"
          mv scratch/one-proof/compact_hashes.txt "$out/final.hashes"
          python3 -I scripts/one_proof/check_axioms.py "$out/final.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the open statements from the checked theorem
        timeout-minutes: 12
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/height-evidence"
          cp docs/one-proof/open-statements.json "$out/open-statements.preview.json"
          lake env lean scripts/one_proof/OpenStatements.lean
          cp docs/one-proof/open-statements.json "$out/open-statements.json"
          python3 -IB - "$out" <<'PY'
          import json, sys
          from pathlib import Path

          out = Path(sys.argv[1])
          expected, actual = (json.loads((out / name).read_text())
                              for name in ("open-statements.preview.json", "open-statements.json"))
          assert actual == expected, "Lean's hypothesis catalog differs from the preview"
          assert actual["count"] == len(actual["hypotheses"]) == 26
          print("Lean regenerated 26 open assumptions matching the preview")
          PY
          lake env lean scratch/contrib-kit/DischargesTest.lean > "$out/DischargesTest-output.txt"
          cp "$out/DischargesTest-output.txt" scratch/contrib-kit/DischargesTest-output.txt
          python3 -IB scripts/one_proof/render_open.py
          python3 -IB scripts/one_proof/render_open.py --check

      - name: Compare the old headline with the compiled fold
        if: ${{ !cancelled() && steps.fold.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/height-evidence"
          cp ZInQKernel/OneProof/Main.lean "$out/Main.candidate.lean"
          trap 'cp "$out/Main.candidate.lean" ZInQKernel/OneProof/Main.lean' EXIT
          git show "$BASE:ZInQKernel/OneProof/Main.lean" > ZInQKernel/OneProof/Main.lean
          if ! timeout -k 30 600 lake --fail-fast build +ZInQKernel.OneProof.Main > "$out/baseline-build.log" 2>&1; then
            tail -n 65 "$out/baseline-build.log"
            exit 1
          fi
          lake env lean scratch/one-proof/DumpCompact.lean | tee "$out/baseline.txt"
          mv scratch/one-proof/compact_hashes.txt "$out/baseline.hashes"
          cp "$out/Main.candidate.lean" ZInQKernel/OneProof/Main.lean
          git diff --exit-code -- ZInQKernel
          python3 -IB - "$out" <<'PY'
          from pathlib import Path
          import sys

          out = Path(sys.argv[1])
          def hashes(label):
              return dict(line.split(maxsplit=1) for line in (out / f"{label}.hashes").read_text().splitlines())
          old, new = hashes("baseline"), hashes("final")
          missing = set(old) - set(new)
          changed = {name for name in set(old) & set(new) if old[name] != new[name]}
          print(f"{len(old)} old declarations, {len(new)} after the fold")
          print("Missing:", sorted(missing), "Changed:", sorted(changed))
          assert not missing
          assert changed == {"ZInQ.OneProof.frozenTarget"}
          PY

      - name: Keep the verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: height-fold-evidence
          path: |
            ${{ runner.temp }}/height-evidence/*.log
            ${{ runner.temp }}/height-evidence/*.hashes
            ${{ runner.temp }}/height-evidence/*.json
            ${{ runner.temp }}/height-evidence/*.txt
          if-no-files-found: warn
