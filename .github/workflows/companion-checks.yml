name: Companion checks

on:
  push:
    branches: [main]
    paths:
      - 'docs/companion/**'
      - '.github/workflows/companion-checks.yml'
  pull_request:
    paths:
      - 'docs/companion/**'
      - '.github/workflows/companion-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Companion overlay and annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Generated overlay files, config, bundle and annotations
        working-directory: docs/companion/manuscript
        run: python3 pdf-overlay/tools/check_generated.py
      - name: Literature Links scan of the annotations
        working-directory: docs/companion/manuscript
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=pdf-overlay/tools python3 -m literature_links scan annotations
