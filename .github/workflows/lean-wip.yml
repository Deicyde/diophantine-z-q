# Scratch verification of the theta line module at this ref.

name: lean wip

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        timeout-minutes: 20
        run: lake exe cache get Mathlib

      - name: Build the theta line modules
        run: lake build +ZInQKernel.Contrib.OneProof.ThetaLineAnalytic

      - name: Report axioms of the theta line results
        run: |
          cat > "$RUNNER_TEMP/ThetaLineAudit.lean" <<'LEAN'
          import ZInQKernel.Contrib.OneProof.ThetaLineAnalytic

          #print axioms BPAnalytic.ThetaLine.factor_cocycle
          #print axioms BPAnalytic.ThetaLine.fibreAtLift
          #print axioms BPAnalytic.ThetaLine.fibreAtLift_change
          #print axioms BPAnalytic.ThetaLine.thetaSection_eq_zero_iff
          #print axioms BPAnalytic.ThetaLine.fibreAtChart_change
          #print axioms BPAnalytic.ThetaLine.bundleCore_isContMDiff
          LEAN
          lake env lean "$RUNNER_TEMP/ThetaLineAudit.lean"
