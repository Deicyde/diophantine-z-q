# Scratch build of the follow-up's largest new package on the runner type of upstream's kernel job
# (4 threads, extra swap). CloudB2X0Transitive's 664 vendored modules (ported from Anthropic's FLT
# formalization) need only Mathlib and CloudW02Connectedness's vendored FLT utilities, so this
# avoids the cold build of main's modules, which lost its runner in three of five attempts.

name: lean wip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    name: CloudB2X0Transitive vendor tree
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - name: Check out the follow-up
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Add 24 GiB swap
        run: |
          set -euo pipefail
          swap_file=$(mktemp "$RUNNER_TEMP/swap.XXXXXX")
          sudo fallocate -l 24G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          free -m; df -h .

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Build the vendored FLT tree
        continue-on-error: true
        run: |
          set -o pipefail
          mods=$(git ls-tree -r --name-only HEAD -- ZInQKernel/Contrib/CloudB2X0Transitive/Vendor | grep '\.lean$' | sed 's/\.lean$//; s|/|.|g')
          echo "modules: $(echo "$mods" | wc -l)"
          /usr/bin/time -v lake build $mods 2>&1 | tee build-vendor.log | tail -25

      - name: Summary
        if: always()
        run: |
          grep -E 'Elapsed \(wall clock\)|Maximum resident|User time|Build completed|error:' build-vendor.log | head -12
          grep -c '✔' build-vendor.log || true
          df -h .; free -m
