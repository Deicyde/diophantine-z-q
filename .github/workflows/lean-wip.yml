# Scratch measurement of the Tau Ceti Lake dependency: a cold and a warm build of the Tau Ceti
# modules the fork's contribution modules import, on the runner type of upstream's kernel job.

name: lean wip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '4'
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Resolved packages
        run: |
          nproc; free -g
          ls .lake/packages
          git -C .lake/packages/TauCeti rev-parse HEAD
          git status --short

      - name: Cold build of the Tau Ceti closure
        run: |
          set -o pipefail
          /usr/bin/time -v lake build ZInQKernel.Contrib.TauCetiClosure 2>&1 | tail -40

      - name: Warm rebuild
        run: |
          set -o pipefail
          /usr/bin/time -v lake build ZInQKernel.Contrib.TauCetiClosure 2>&1 | tail -30

      - name: Manifest and lakefile after the builds
        run: git status --short; git diff --stat
