name: Protocol B PDF reader test
on:
  pull_request:
    paths:
      - '.github/workflows/protocol-b.yml'
      - '.github/workflows/protocol-b-pdf-test.yml'
      - 'tests/protocol_b/**'
  workflow_dispatch:
  schedule:
    - cron: '29 6 * * 1'
permissions:
  contents: read
jobs:
  pdf_reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils bubblewrap
          dpkg-query -W poppler-utils bubblewrap coreutils
      - name: Exercise real PDF extraction without provider or App secrets
        env:
          PROTOCOL_B_TEST_PDF_ISOLATION: '1'
        run: python3 -B -m unittest discover -s tests/protocol_b -p test_manuscript_coverage.py -v
