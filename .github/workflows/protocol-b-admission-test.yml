name: Protocol B live admission test
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: protocol-b-live-admission-test
  cancel-in-progress: false
jobs:
  reservation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: protocol-b
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint test reservation App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PROTOCOL_B_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_B_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Post and read back the test intent and reservation
        env:
          MODE: test
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_ID: ${{ vars.PROTOCOL_B_APP_ID }}
        run: python3 -B .github/scripts/test_protocol_b_admission.py
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-b-live-admission-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protocol-b-admission-test/
          if-no-files-found: error
          retention-days: 90
