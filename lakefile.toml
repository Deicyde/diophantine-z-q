name = "z_in_q_kernel"
version = "0.1.0"
defaultTargets = ["ZInQKernel"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Upstream's accepted helper snapshot, kept byte for byte in `lean/`.
[[require]]
name = "z_in_q"
path = "lean"

[[lean_lib]]
name = "ZInQKernel"

# Vendored Green-Tao proof (Vilin97/Autoformalization, green-tao/, Apache-2.0); see
# ThirdParty/GreenTao/NOTICE.md.
[[lean_lib]]
name = "GreenTaoVendor"
srcDir = "ThirdParty/GreenTao"
roots = ["Submission", "ChallengeDeps"]
leanOptions = { autoImplicit = false }

# Modules of the CM Serre-Tate route (`cmPotentialGood`) that keep their own top-level module names: 85 root
# modules and the `FrobLift` submodules. An explicit `globs` replaces the default one glob per root, so the roots
# are listed there as well; `FrobLift.+` selects the submodules of `FrobLift` (there is no module `FrobLift`).
