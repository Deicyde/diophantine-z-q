name = "z_in_q_kernel"
version = "0.1.0"
defaultTargets = ["ZInQKernel"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Upstream's accepted helper snapshot, kept byte for byte in `lean/`.
[[require]]
name = "z_in_q"
path = "lean"

[[lean_lib]]
name = "ZInQKernel"

# Finite checks proved by native evaluation (milestone 1); never imported by `ZInQKernel`.
[[lean_lib]]
name = "ZInQFinite"
